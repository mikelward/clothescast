# Translated from this repo's former hand-synced shell lane-classification
# script (its is_housekeeping()/LANE_PREFIXES/dispatch_without_pr_ok(),
# deleted in this migration) -- replaced here by the shared mikelward/lanes
# engine. The gate check keeps its current name (`gate`) for now: the
# ruleset still requires it, and ci.yml runs a duplicate `lanes` job
# alongside it until the ruleset is flipped and `gate` is retired (see
# that job's comment in ci.yml, and mikelward/lanes's README "Renaming an
# existing consumer's check").
#
# Markdown outside app/ and core/ cannot change what CI validates; anything
# under app/ or core/ is a build input whatever its extension (a packaged
# asset, or a resource the core JVM modules bundle into their artifacts, can
# be markdown), so those stay on the code lane. PRIVACY.md is ordinary docs
# like the rest -- Play's "What's new" is a store-listing field a user
# installing an update never sees at update time, so forcing a wording-only
# policy change through the code lane never bought real visibility, only
# heavier CI. It used to be a build input here, because a unit test read the
# file and asserted its wording; that test is gone, and with it the reason.
# Order matters: app/** and core/** are checked before the general markdown
# rule, or a markdown file under one of those trees would ride the docs lane
# before its own rule ever got a chance to say otherwise.
code app/**
code core/**
# Root markdown and the docs/ tree only. The asymmetry is deliberate: `*.md`
# does not cross `/`, so it reaches the root and no further, while
# `docs/**/*.md` does, so it reaches every depth below docs/ and nowhere else.
# Writing the tree rule `docs/*.md` looks tidier and is a trap -- it puts a
# file one level down on the code lane. A bare `**/*.md` is the opposite
# mistake: it makes a markdown build input documentation at any depth.
docs *.md
docs docs/**/*.md

# This repo's commit-subject conventions for housekeeping commits (see
# AGENTS.md "Commits and PRs"). Every commit riding the docs lane must
# carry one.
prefixes ci docs internal test

# The retired shell script never checked the PR title, only commit
# subjects -- kept off here too, so this migration doesn't silently add a
# new requirement an in-flight PR's title was never held to. Worth
# revisiting separately.
# Classify a push to main by the range it added, rather than by a paths
# filter on the trigger restating these rules in another language.
push classify

lint-title no

# This repo's workflow_dispatch serves two callers: the screenshot-refresh
# dispatch (mikelward/ci-commit-artifact's dispatch-workflow, always names
# its PR) and the maintainer's release-rescue dispatch on main (never has
# one). A PR-less dispatch is therefore allowed only on the default branch
# -- verified live via the API, never from anything a dispatched branch's
# own checkout could claim -- and refused anywhere else, because on a PR
# branch it would be the gate-bypass the binding checks exist to stop.
dispatch-without-pr allow-on-default-branch
