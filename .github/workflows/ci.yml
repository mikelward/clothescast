name: CI

on:
  # Don't trigger on pushes to feature branches — pull_request covers those.
  # Without this, every commit on a PR branch fires CI twice (once for `push`
  # to the branch, once for `pull_request`), and the two runs race on the
  # shared Gradle cache so one frequently fails while the other passes.
  #
  # paths: skip CI when a push/PR only touches top-level dotfiles or
  # hidden directories (.claude/, .gitignore, .editorconfig, .github/
  # ISSUE_TEMPLATE, dependabot.yml, …). Agent-config / repo-metadata
  # changes don't move app or build logic, so the ~5min CI cycle is
  # wasted there. A push that mixes a dotfile change with any non-
  # dotfile path still runs (the include `**` matches the non-dotfile).
  #
  # Uses `paths` (with `!` negations) rather than `paths-ignore` because
  # `paths-ignore` is documented as exclude-only — combining include
  # and exclude requires the `paths` form per GitHub's workflow syntax
  # docs. Patterns evaluate in order, with later overriding earlier:
  #   1. `**`                     — default, every path triggers
  #   2. `!.*` / `!.*/**`         — …except top-level dotfiles + hidden dirs
  #   3. `.github/workflows/**`   — …re-include this file's peers, since
  #                                 a workflow-only PR IS exactly what
  #                                 CI most needs to validate.
  push:
    branches: [main]
    paths:
      - '**'
      - '!.*'
      - '!.*/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '**'
      - '!.*'
      - '!.*/**'
      - '.github/workflows/**'
  # Manual rescue trigger so the release-AAB / Firebase / Play-upload steps
  # can be re-fired when the natural `push` event didn't produce a usable
  # build (e.g. a transient gradle / Play API failure on the original
  # push-to-main run). Run from Actions tab → CI → "Run workflow",
  # target `main`.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: JVM unit tests
    runs-on: ubuntu-latest
    permissions:
      # contents: write so the snapshot-commit step can push regenerated PNGs
      # back to the PR branch. GITHUB_TOKEN-authored commits do not trigger new
      # workflow runs (GitHub safety mechanism), so there's no infinite loop.
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # `app/build.gradle.kts` derives `versionCode` from
          # `git rev-list --count HEAD`. Shallow clones return 1 every time,
          # so every build would collide on versionCode 1.
          fetch-depth: 0
          # Check out the PR's actual head ref (not the merge commit's detached
          # HEAD) so the snapshot-commit step below can `git push` back to it.
          # Falls back to the default ref outside PRs (push-to-main runs).
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        # AGP must be loadable for Gradle to configure :app, even when only
        # running :core:* tasks. Pre-installing platform 36 + build-tools 36.0.0
        # avoids on-demand downloads at configure time.
        # Pinned to a specific commit SHA (rather than the floating @v3 tag)
        # so a compromised upstream release can't silently swap in malicious
        # code on our next CI run — same discipline as the FAD / Play upload
        # actions below. SHA is android-actions/setup-android v3.2.2.
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Decode google-services.json from secret
        # The Firebase Gradle plugins (gms-google-services + crashlytics) are
        # applied conditionally on `app/google-services.json` being present —
        # see app/build.gradle.kts. Materialising the file here makes the
        # plugins apply on CI, so unit-tests and android-build see the same
        # plugin state. Without this, the file is absent in CI sandboxes
        # (it's .gitignore-d) and the SDKs no-op via
        # FirebaseApp.getApps(...).isEmpty() at runtime — which is correct,
        # just silently telemetry-less. Skipped quietly when the secret
        # isn't set (fork PR / fresh repo).
        #
        # Auto-detects whether the secret holds raw JSON or base64. This
        # repo's other binary secrets (DEBUG_KEYSTORE_BASE64,
        # UPLOAD_KEYSTORE_BASE64) must be base64 because they're binary;
        # google-services.json is text, so pasting it raw works too and is
        # one fewer step at setup time. Either shape is accepted.
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "No GOOGLE_SERVICES_JSON secret available; build will skip Firebase plugins."
            exit 0
          fi
          # Strip surrounding whitespace so a stray newline at the end of a
          # paste (or default 76-col-wrapped base64) doesn't trip strict
          # decoders. A leading `{` after stripping means the user pasted
          # raw JSON — write it through. Otherwise treat as base64.
          trimmed="$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]')"
          first_char="$(printf '%s' "$trimmed" | head -c 1)"
          if [ "$first_char" = "{" ]; then
            echo "Detected raw JSON in secret; writing through without base64 decode."
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            if ! printf '%s' "$trimmed" | base64 --decode > app/google-services.json 2>/dev/null; then
              echo "::error::Failed to base64-decode GOOGLE_SERVICES_JSON. Re-create the secret with the OUTPUT of \`base64 -w0 app/google-services.json\` (Linux) or \`base64 -i app/google-services.json | tr -d '\\n'\` (macOS). Or paste the JSON file contents directly — auto-detect handles either shape."
              exit 1
            fi
          fi
          # Sanity-check the result so a wrong-file paste fails here rather
          # than as a confusing gms-plugin "JSON parse error" several
          # minutes into gradle. Report byte count so a truncated paste is
          # obvious from the log.
          bytes="$(wc -c < app/google-services.json | tr -d ' ')"
          if ! grep -q '"project_info"' app/google-services.json || \
             ! grep -q '"client"'       app/google-services.json; then
            echo "::error::app/google-services.json (${bytes} bytes) is missing project_info / client keys — secret value isn't a valid Firebase config JSON or paste was truncated."
            exit 1
          fi
          echo "google-services.json materialised (${bytes} bytes)."

      - name: Run unit tests
        id: gradle
        run: |
          set -o pipefail
          ./gradlew :core:domain:test :core:data:test :app:testDebugUnitTest --stacktrace --info 2>&1 | tee /tmp/jvm-tests.log

      - name: Clear prior CI comments for this job
        # Runs on both pass and fail. A green run on a fix commit removes the
        # earlier failure comment, so the PR conversation doesn't accumulate
        # stale stack traces every time someone pushes a typo and then fixes it.
        # Skipped on cancellation so a manually-cancelled run doesn't wipe the
        # comment from a still-real failure.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- ci-jvm-tests -->';
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            for (const c of comments) {
              if (c.user.type === 'Bot' && c.body && c.body.includes(marker)) {
                await github.rest.issues.deleteComment({
                  ...context.repo,
                  comment_id: c.id,
                });
              }
            }

      - name: Post tail of gradle log on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '/tmp/jvm-tests.log';
            let body = '_(no log captured)_';
            try {
              const log = fs.readFileSync(path, 'utf8');
              const lines = log.split('\n');
              const errorLines = lines.filter(l =>
                /^(e:|w:| {2}error:|FAILURE:|\* What went wrong:|Caused by:|Compilation error)/.test(l)
              ).slice(0, 80);
              const tail = lines.slice(-300).join('\n');
              body = '<!-- ci-jvm-tests --> JVM unit tests failed.\n\n' +
                '### Likely error lines\n```\n' + (errorLines.join('\n') || '(none matched)') + '\n```\n' +
                '### Last 300 lines\n```\n' + tail + '\n```';
            } catch (e) {
              body = 'JVM unit tests failed before gradle started: ' + e.message;
            }
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            /tmp/jvm-tests.log
          retention-days: 14

      - name: Commit regenerated UI snapshots back to PR branch
        # Roborazzi renders every @Preview to PNG under app/snapshots/
        # (a tracked path). When a UI change shifts pixels, this step commits
        # the new PNGs back to the PR branch so the diff shows up natively in
        # GitHub's "Files changed" image view — no artifact download needed.
        #
        # Same-repo PRs only: forks don't have token write access to the head
        # repo, so the conditional skips them (the artifact upload below is
        # the fallback there). The step is also skipped on push-to-main, where
        # there's no PR branch to update.
        #
        # Loop safety: GITHUB_TOKEN-authored commits don't trigger new workflow
        # runs, and the `git diff --quiet` check no-ops when nothing changed,
        # so reruns and identical re-records don't create empty churn commits.
        # That's why the commit message below intentionally does NOT carry
        # `[skip ci]`: GITHUB_TOKEN already prevents the PR-branch loop, and
        # adding `[skip ci]` would only cause harm — when the snapshot-regen
        # commit ends up as the head of a rebase-merge to `main`, GitHub
        # natively skips the push-to-main run on `[skip ci]`, and the
        # release-AAB / Firebase / Play-upload steps never fire for that SHA.
        #
        # Records SNAPSHOT_COMMIT_SHA / SNAPSHOTS_REGENERATED into the env so
        # the freshness-comment step downstream can report what happened.
        id: snapshot_commit
        if: >-
          success() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          # Pass the PR branch name through an env var rather than expanding
          # `${{ github.event.pull_request.head.ref }}` directly into the
          # shell script: git's check-ref-format allows characters like `'`,
          # `$`, `;`, `|`, `&` and backticks in branch names, so a same-repo
          # collaborator could create a branch named e.g. `feat';evil;'` and
          # have it injected as shell code via the `git push` line below.
          # As an env var, the value is exposed to the shell as data and
          # safely quoted at the use site.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -d app/snapshots ]; then
            # Remove PNGs for deleted or renamed @Test methods (orphaned snapshots).
            # Auto-discover every Kotlin test source — snapshot tests write to
            # "$outputDir/<methodName>.png", so a PNG whose basename matches no
            # @Test method anywhere in app/src/test is genuinely orphaned. The
            # previous version hard-coded a snapshot_sources list and silently
            # deleted PNGs whose test file wasn't on it (db7aaf8 → 25cfc6d:
            # SettingsClothesFullSnapshot.kt's snapshot survived the test pass
            # only to be wiped here on the way to commit). Scanning every test
            # file zero-configures any future snapshot file.
            # Slurped perl match handles both `@Test fun foo()` and
            # multi-line `@Test\n@Config(...)\nfun foo()` styles — a single-line
            # `(?<=@Test fun )` regex misses the latter and would prune the PNG
            # as orphaned even though the test still runs.
            # Scan every test source root, including variant-specific
            # ones like `src/testDebug/` (added 2026-05 for the App Check
            # debug-token snapshot). Missing a source root here silently
            # marks every PNG only that root's tests record as orphaned
            # and deletes it on the next CI regen — the bug behind PR
            # #905's first regen wiping
            # `settings_voice_app_check_debug_token.png`. A glob covers
            # any future `testRelease`, `androidTest`, etc. without
            # another edit here.
            expected=$(find app/src/test app/src/test[A-Z]* -name '*.kt' -print0 2>/dev/null \
              | xargs -0 perl -0777 -ne 'while (/\@Test\b(?:\s|\@\w+(?:\([^)]*\))?)*?\bfun\s+(\w+)/g) { print "$1\n" }')
            for png in app/snapshots/*.png; do
              [ -f "$png" ] || continue
              name=$(basename "$png" .png)
              if ! echo "$expected" | grep -qxF "$name"; then
                rm "$png"
                echo "Removed orphaned snapshot: $name.png"
              fi
            done
            # Stage new files, modifications, AND deletions.
            git add -A app/snapshots
          fi
          if git diff --cached --quiet; then
            echo "No snapshot changes."
            echo "SNAPSHOTS_REGENERATED=false" >> "$GITHUB_ENV"
            echo "SNAPSHOT_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            exit 0
          fi
          git commit -m "ci: regenerate UI snapshots"
          git push origin "HEAD:$HEAD_REF"
          echo "SNAPSHOTS_REGENERATED=true" >> "$GITHUB_ENV"
          echo "SNAPSHOT_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Comment snapshot freshness on PR
        # Sticky comment (single per-PR, updated in place via the marker) so
        # reviewers always know whether the PNGs in the PR's "Files changed"
        # tab are current. Three signals:
        #   - whether *this* run regenerated PNGs (vs reused unchanged ones)
        #   - the head SHA the snapshots were rendered against
        #   - the count of PNGs (catches the silent case where a renamed
        #     @Test method writes to a new file and old PNGs go stale)
        if: >-
          success() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'app/snapshots';
            let count = 0;
            try {
              count = fs.readdirSync(path).filter(f => f.endsWith('.png')).length;
            } catch (e) {
              // Directory missing — first PR before any snapshot has been
              // recorded. Report 0 so the user sees the situation clearly.
            }
            const headSha = (process.env.SNAPSHOT_COMMIT_SHA || context.sha).slice(0, 7);
            const regenerated = process.env.SNAPSHOTS_REGENERATED === 'true';
            const status = regenerated
              ? `🔄 Regenerated ${count} UI snapshot${count === 1 ? '' : 's'} this run.`
              : `✅ ${count} UI snapshot${count === 1 ? '' : 's'} up-to-date — no pixel changes from this push.`;
            const body = `<!-- ui-snapshots-status -->
            **UI snapshots:** ${status}

            Head: \`${headSha}\` · Browse: [\`app/snapshots/\`](https://github.com/${context.repo.owner}/${context.repo.repo}/tree/${context.payload.pull_request.head.ref}/app/snapshots)`;
            const marker = '<!-- ui-snapshots-status -->';
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload UI preview snapshots (fallback for fork PRs)
        # Same PNGs as the in-repo commit above, kept as a workflow artifact
        # so reviewers on a fork PR (where the commit-back step is skipped
        # for lack of token write access) can still download and eyeball them.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-preview-snapshots
          path: app/snapshots/
          if-no-files-found: ignore
          retention-days: 14

  android-build:
    name: Android debug build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      # Needed by the "Prepare release notes" step's Actions-API fallback,
      # which queries the most recent successful main CI run when
      # `github.event.before` isn't usable (workflow_dispatch, first push
      # to a fresh branch).
      actions: read
    # workflow_dispatch can be invoked against any ref by any user with
    # `actions: write`; a manual dispatch against a feature branch that
    # ships a malicious `ci.yml` modification would otherwise have job
    # secrets in scope. push events are already filtered to main by the
    # `on:` block, and pull_request secrets are blocked by GitHub for fork
    # PRs — but *same-repo* PRs still receive secrets unless we gate
    # individual secret-loading steps to main (see the "Probe publish
    # secrets" / debug-keystore-decode / Firebase / Play steps below,
    # each of which `if:`-gates secret access to push/dispatch on main).
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          # See unit-tests job above — versionCode comes from rev-list --count.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        # SHA-pinned — see rationale on the unit-tests job's copy of this step.
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Decode google-services.json from secret
        # See unit-tests job for the rationale and the raw-vs-base64
        # auto-detect. Decoding both here and there keeps the Firebase
        # plugin state consistent across jobs.
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "No GOOGLE_SERVICES_JSON secret available; APK will be built without Firebase config."
            exit 0
          fi
          trimmed="$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]')"
          first_char="$(printf '%s' "$trimmed" | head -c 1)"
          if [ "$first_char" = "{" ]; then
            echo "Detected raw JSON in secret; writing through without base64 decode."
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            if ! printf '%s' "$trimmed" | base64 --decode > app/google-services.json 2>/dev/null; then
              echo "::error::Failed to base64-decode GOOGLE_SERVICES_JSON. Re-create the secret with the OUTPUT of \`base64 -w0 app/google-services.json\` (Linux) or \`base64 -i app/google-services.json | tr -d '\\n'\` (macOS). Or paste the JSON file contents directly — auto-detect handles either shape."
              exit 1
            fi
          fi
          bytes="$(wc -c < app/google-services.json | tr -d ' ')"
          if ! grep -q '"project_info"' app/google-services.json || \
             ! grep -q '"client"'       app/google-services.json; then
            echo "::error::app/google-services.json (${bytes} bytes) is missing project_info / client keys — secret value isn't a valid Firebase config JSON or paste was truncated."
            exit 1
          fi
          echo "google-services.json materialised (${bytes} bytes)."

      - name: Decode debug keystore from secret
        # Stable signing identity across CI builds so the installed app upgrades
        # in place instead of failing "App not installed (signature mismatch)"
        # on every new APK. Gated to push / workflow_dispatch on main only:
        # PR `assembleDebug` runs (incl. same-repo PRs) deliberately don't
        # decode this keystore so a malicious Gradle modification in a PR
        # can't exfiltrate DEBUG_KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
        # or read /tmp/debug.keystore. AGP falls back to its auto-generated
        # debug keystore on PR builds — the APK still builds and runs, just
        # without the stable signing identity. FAD distribution is main-only
        # anyway (see Firebase step below), so PR-built APKs aren't pushed
        # to testers and the lost in-place-upgrade property doesn't matter.
        # Skipped quietly when DEBUG_KEYSTORE_BASE64 isn't set (fresh repo).
        #
        # On success this step propagates all four DEBUG_* values to
        # $GITHUB_ENV so the Assemble step below picks them up without
        # re-referencing secrets — i.e. secrets enter this job's process
        # environment only in this step (main-gated), nowhere else.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "No DEBUG_KEYSTORE_BASE64 secret available; build will use AGP-default debug keystore."
            exit 0
          fi
          # If one stable-keystore secret is set, all four must be set. Otherwise
          # gradle later errors with "Partial debug-keystore configuration", but
          # the decode step itself would also throw a confusing keytool message
          # in the meantime. Catch it here with an explicit list of what's
          # missing so the failure is unambiguous.
          missing=""
          [ -z "$DEBUG_KEYSTORE_PASSWORD" ] && missing="$missing DEBUG_KEYSTORE_PASSWORD"
          [ -z "$DEBUG_KEY_ALIAS" ]         && missing="$missing DEBUG_KEY_ALIAS"
          [ -z "$DEBUG_KEY_PASSWORD" ]      && missing="$missing DEBUG_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 is set but the following companion secrets are missing or empty:$missing"
            exit 1
          fi
          # printf rather than echo: portable across shells and doesn't append
          # a trailing newline that some base64 implementations choke on.
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > /tmp/debug.keystore
          # Validate the decoded file is actually a usable PKCS12/JKS keystore
          # with the configured password, rather than just non-empty bytes.
          # Catches "wrong base64", "wrong password", "uploaded a JPEG by
          # mistake" — at the early-fail step, not at signing-step time.
          if ! keytool -list -keystore /tmp/debug.keystore -storepass "$DEBUG_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Decoded keystore at /tmp/debug.keystore is not a valid keystore or DEBUG_KEYSTORE_PASSWORD is wrong."
            exit 1
          fi
          # Propagate to $GITHUB_ENV so the Assemble step picks them up
          # without itself referencing `${{ secrets.* }}`. Values are still
          # masked in logs (`add-mask` was applied when GitHub injected them
          # as `env:` here). Heredoc form is robust if a value ever contains
          # newlines; KEY_ALIAS realistically won't, but uniform style is
          # cheaper than knowing-the-edge-cases.
          {
            echo "DEBUG_KEYSTORE_FILE=/tmp/debug.keystore"
            printf 'DEBUG_KEYSTORE_PASSWORD<<__EOF__\n%s\n__EOF__\n' "$DEBUG_KEYSTORE_PASSWORD"
            printf 'DEBUG_KEY_ALIAS<<__EOF__\n%s\n__EOF__\n' "$DEBUG_KEY_ALIAS"
            printf 'DEBUG_KEY_PASSWORD<<__EOF__\n%s\n__EOF__\n' "$DEBUG_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Assemble debug APK
        # No step-level `env:` referencing secrets here: on main, the four
        # DEBUG_* env vars arrive via $GITHUB_ENV from the decode step
        # above; on PRs (where the decode step is skipped) they're absent
        # and AGP's signingConfigs block in app/build.gradle.kts falls back
        # to the auto-generated debug keystore. This keeps PR builds from
        # ever seeing the secret values in their gradle process.
        id: gradle
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --info 2>&1 | tee /tmp/android-build.log

      - name: Upload debug APK
        # Up here, before the release-AAB steps, so a bundleRelease failure
        # doesn't gate this artifact behind a now-failed `success()`.
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Prepare release notes for FAD and Play
        # Single source of truth for "what changed in this build" copy. Both
        # Firebase App Distribution (tester push-notification + release page)
        # and Play Store internal track (whatsnew-en-US) ship this string to
        # humans, so they MUST agree — and they MUST be a curated, end-user
        # bullet list, not raw head-commit content.
        #
        # Lists every commit's subject as a `• `-prefixed bullet, oldest →
        # newest, for the range between the previous *released* main build
        # and this one. We deliberately don't use `github.event.before` as
        # the range base: if a prior main push failed before distribution,
        # `before` would be that failed-push tip and the next run's notes
        # would silently omit the unreleased commits from the failed run.
        # The Actions API gives us "last *released* tip" instead — walking
        # main's recent workflow runs newest-first and picking the first
        # one whose `android-build` JOB concluded with success. Gating on
        # the job rather than the workflow run matters because
        # `unit-tests` and `android-build` run in parallel without
        # `needs:` and the publish steps live only in `android-build`: a
        # run where `unit-tests` fails but `android-build` succeeds DID
        # publish, so its head SHA is the right base — querying the
        # workflow's overall conclusion would skip it and double-bullet
        # its commits in the next fully-green run's notes. The current
        # run is filtered out (no job conclusion yet); we also skip any
        # prior runs of the same head SHA (manual re-runs). When no
        # prior released build is reachable (fresh repo, fork, history
        # rewrite), the range collapses to the head commit alone.
        #
        # Per-commit filter: a commit's subject is skipped if it would read
        # as noise to a non-engineer — anything prefixed `ci:` (the
        # snapshot-regen bot commits "ci: regenerate UI snapshots", workflow
        # tweaks, etc.), `test:` (test-only changes that ship nothing in
        # the APK), or `internal:` (internal-only changes that ship nothing
        # user-visible — refactors, renames, dependency bumps), and changes
        # whose paths are all under `docs/`, all
        # top-level dotfiles or hidden directories (`.github/`, `.claude/`,
        # `.gitignore`, `.editorconfig`, …), or top-level `*.md`. PRIVACY.md
        # is treated as non-docs so that privacy-policy updates still surface
        # to users.
        #
        # Fallback chain when the range yields no bullets (every commit in
        # it was filtered out — e.g. a `.github/workflows/**`-only push,
        # which still triggers main CI per the workflow's `paths:` block):
        #   1. Walk back through up to 20 ancestors of the head commit
        #      looking for a non-filtered subject; emit that as a single
        #      bullet. Matches the pre-multi-commit behaviour so unusual
        #      stretches of filtered commits still surface *something*
        #      user-readable.
        #   2. If even that turns up nothing, emit the head subject as a
        #      single bullet, filtered or not — better a slightly noisy
        #      changelog than an empty one.
        #
        # Play's `whatsnew-en-US` is capped at 500 bytes; if the bullet list
        # would exceed that, we truncate at byte 497 (via `iconv -c` to
        # avoid leaving a partial UTF-8 sequence) and append `…` so the
        # user can tell something was cut. The 50-commit `--max-count` on
        # `git rev-list` is a safety net for unusually long ranges; in
        # practice the 500-byte cap bites first.
        #
        # Outputs:
        #   - $RUNNER_TEMP/whatsnew/whatsnew-en-US  (consumed by Play upload)
        #   - $RELEASE_NOTES in $GITHUB_ENV         (multi-line via heredoc;
        #     consumed by the FAD step's releaseNotes input, which composes
        #     it with a `---` divider + `Build: N · SHA` trailer)
        #
        # Gated on push/dispatch to main only — feature-branch CI runs don't
        # distribute, so the prep work would be wasted there. No secret gate:
        # FAD and Play each have their own secret gates downstream, but the
        # notes should be computed even when only one of the two is wired up.
        if: |
          success() &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        env:
          # `gh api` needs the token explicitly; everything else uses the
          # auto-provided $GITHUB_SHA / $GITHUB_REPOSITORY rather than
          # re-aliasing into step-local names.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/whatsnew"
          head_sha="$GITHUB_SHA"

          # Walk the most recent main runs of this workflow (newest first)
          # and pick the head SHA of the first one whose `android-build`
          # job *specifically* concluded with success. We gate on the job,
          # not the workflow run, because `unit-tests` and `android-build`
          # run in parallel without `needs:` and the publish steps live
          # only in `android-build`: a run where `unit-tests` fails but
          # `android-build` succeeds still publishes, so its head SHA is
          # the correct base for "since the last released build."
          # Filtering on workflow `status=success` instead would skip
          # such runs and double-bullet their commits in the next
          # fully-green run's changelog. The job name below must match
          # this job's `name:` value verbatim — rename here in lockstep
          # if you ever rename the job.
          prev_sha=""
          while IFS=$'\t' read -r run_id run_head; do
            [ -z "$run_id" ] && continue
            # Skip the current run (in_progress, doesn't have a conclusion
            # yet anyway) and any prior runs of the same head SHA — those
            # are manual re-runs of this commit.
            [ "$run_head" = "$head_sha" ] && continue
            job_conclusion=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
              --jq '.jobs[] | select(.name == "Android debug build") | .conclusion' \
              2>/dev/null || true)
            if [ "$job_conclusion" = "success" ]; then
              prev_sha="$run_head"
              break
            fi
          done < <(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&per_page=20" \
            --jq '.workflow_runs[]? | [.id, .head_sha] | @tsv' \
            2>/dev/null || true)

          base_sha=""
          if [ -n "$prev_sha" ] && git cat-file -e "$prev_sha" 2>/dev/null; then
            base_sha="$prev_sha"
          fi

          if [ -n "$base_sha" ]; then
            mapfile -t shas < <(git rev-list --reverse --max-count=50 \
              "$base_sha..$head_sha")
            if [ "${#shas[@]}" -eq 0 ]; then
              shas=("$head_sha")
            fi
          else
            shas=("$head_sha")
          fi

          # Predicate: returns 0 if the commit subject + paths should be
          # filtered out of the changelog. Shared by the range walk and
          # the ancestor-walk fallback below.
          is_noise() {
            local sha="$1" subject non_doc_count
            subject=$(git log -1 --pretty=%s "$sha")
            case "$subject" in
              ci:*|test:*|internal:*) return 0 ;;
            esac
            non_doc_count=$(git show --no-renames --name-only --pretty=format: "$sha" \
              | sed '/^$/d' \
              | awk '
                  /^PRIVACY\.md$/ { count++; next }
                  /^docs\//       { next }
                  /^\./           { next }
                  /\.md$/         { next }
                                  { count++ }
                  END             { print count + 0 }
                ')
            [ "$non_doc_count" -eq 0 ]
          }

          bullets=""
          for sha in "${shas[@]}"; do
            [ -z "$sha" ] && continue
            if is_noise "$sha"; then
              continue
            fi
            subject=$(git log -1 --pretty=%s "$sha")
            if [ -z "$bullets" ]; then
              bullets="• $subject"
            else
              bullets="$bullets"$'\n'"• $subject"
            fi
          done

          # Range was all-filtered — walk back through ancestors of the
          # head commit for up to 20 hops to find the most recent
          # non-filtered subject.
          if [ -z "$bullets" ]; then
            walk_sha="$head_sha"
            for _ in $(seq 1 20); do
              if ! git cat-file -e "$walk_sha" 2>/dev/null; then
                break
              fi
              if ! is_noise "$walk_sha"; then
                bullets="• $(git log -1 --pretty=%s "$walk_sha")"
                break
              fi
              if ! walk_sha=$(git rev-parse "$walk_sha^" 2>/dev/null); then
                break
              fi
            done
          fi

          # Absolute last resort: even the ancestor walk found nothing
          # (shallow history, or 20+ consecutive filtered commits). Emit
          # the filtered head subject rather than nothing.
          if [ -z "$bullets" ]; then
            bullets="• $(git log -1 --pretty=%s "$head_sha")"
          fi

          # `…` is 3 bytes in UTF-8; cap content at 497 so total ≤ 500.
          # `iconv -c` drops any partial multi-byte sequence at the cut
          # point, so the truncated bullets remain valid UTF-8.
          if [ "$(printf '%s' "$bullets" | wc -c)" -gt 500 ]; then
            bullets="$(printf '%s' "$bullets" | head -c 497 | iconv -f UTF-8 -t UTF-8 -c)…"
          fi

          printf '%s' "$bullets" > "$RUNNER_TEMP/whatsnew/whatsnew-en-US"
          {
            printf 'RELEASE_NOTES<<EOF_RELEASE_NOTES\n'
            printf '%s\n' "$bullets"
            printf 'EOF_RELEASE_NOTES\n'
          } >> "$GITHUB_ENV"
          echo "Release notes:"
          printf '%s\n' "$bullets"

      - name: Probe publish secrets
        # Sets FIREBASE_AVAILABLE / PLAY_AVAILABLE boolean flags in
        # $GITHUB_ENV so the downstream FAD and Play upload steps can use
        # them in their `if:` conditions (which can't read `secrets.*`
        # directly). Gated to push / workflow_dispatch on main: this is the
        # ONLY step in this job where FIREBASE_* / PLAY_* secrets are ever
        # expanded into env vars. On PR runs (incl. same-repo) the flags
        # remain unset, the FAD and Play steps short-circuit on the flag
        # check, and their `with:` blocks (which also reference these
        # secrets) are never evaluated — so a malicious Gradle change in
        # a PR has no path to read these secret values from the runner's
        # process environment.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_APP_ID" ] && [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "FIREBASE_AVAILABLE=false" >> "$GITHUB_ENV"
          fi
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "PLAY_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "PLAY_AVAILABLE=false" >> "$GITHUB_ENV"
          fi

      - name: Distribute via Firebase App Distribution
        # On push to main (or manual workflow_dispatch on main) only —
        # feature-branch CI runs would otherwise spam testers with WIP builds.
        # workflow_dispatch is the rescue path when the natural push event
        # was suppressed by `[skip ci]` on the head commit. Skipped when
        # the Firebase secrets aren't set so the build still finishes on a
        # fresh repo / fork — see "Probe publish secrets" above for how the
        # FIREBASE_AVAILABLE flag is computed (only on main, so the secret
        # values never enter the runner env on PRs).
        #
        # Ordered before the release-AAB steps so a bundleRelease failure on
        # main doesn't skip FAD distribution under the `success()` gate — debug
        # testers get the build either way; only the Play AAB artifact is lost.
        if: |
          success() &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' &&
          env.FIREBASE_AVAILABLE == 'true'
        # Pinned to a specific commit SHA (rather than the floating @v1 tag) so
        # a compromised upstream release can't silently swap in malicious code
        # on our next CI run. Bump deliberately. SHA below is wzieba/Firebase-
        # Distribution-Github-Action v1.7.1.
        uses: wzieba/Firebase-Distribution-Github-Action@bd494989dd4bec0343f78adee87fe66e48279ad6 # v1.7.1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          # Tester group must exist in Firebase App Distribution console — see
          # docs/firebase-app-distribution.md. "testers" is the convention; rename
          # there + here together if you change it.
          groups: testers
          file: app/build/outputs/apk/debug/app-debug.apk
          # Push notification on the tester's phone shows the first ~60 chars
          # of these notes — must match what Play Store testers see, which is
          # the curated subject computed in "Prepare release notes" above.
          # Raw `head_commit.message` would be wrong twice over: on a `ci:
          # regenerate UI snapshots` head commit testers would see the bot
          # message, and on a normal feature commit they'd get the full body
          # too (file paths, engineering reasoning), which CLAUDE.md reserves
          # for reviewers, not end users.
          releaseNotes: |
            ${{ env.RELEASE_NOTES }}
            ---
            Build: ${{ github.run_number }} · ${{ github.sha }}

      - name: Decode upload keystore from secret
        # Push-to-main (or manual workflow_dispatch on main) only. PR builds
        # (incl. forks) skip — forks don't have the secret, and even non-fork
        # PRs don't need to burn ~3min signing a release AAB on every commit.
        # Mirrors the debug-keystore decode step above: base64-decode,
        # validate with `keytool -list` so wrong-base64 / wrong-password
        # fails here rather than at signing time, then export the path to
        # GITHUB_ENV for bundleRelease to pick up.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::UPLOAD_KEYSTORE_BASE64 secret is not set; cannot build a Play-uploadable AAB."
            exit 1
          fi
          missing=""
          [ -z "$UPLOAD_KEYSTORE_PASSWORD" ] && missing="$missing UPLOAD_KEYSTORE_PASSWORD"
          [ -z "$UPLOAD_KEY_ALIAS" ]         && missing="$missing UPLOAD_KEY_ALIAS"
          [ -z "$UPLOAD_KEY_PASSWORD" ]      && missing="$missing UPLOAD_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::UPLOAD_KEYSTORE_BASE64 is set but the following companion secrets are missing or empty:$missing"
            exit 1
          fi
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$UPLOAD_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Decoded keystore at \$RUNNER_TEMP/upload.jks is not a valid keystore or UPLOAD_KEYSTORE_PASSWORD is wrong."
            exit 1
          fi
          echo "UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Bundle release AAB
        # Push-to-main (or manual workflow_dispatch on main) only — see
        # "Decode upload keystore" rationale. Produces
        # app/build/outputs/bundle/release/app-release.aab signed with the upload
        # key; Play App Signing re-signs with the real signing key on download.
        #
        # Both DEBUG_* and UPLOAD_* env vars are passed: Gradle evaluates *all*
        # signingConfigs at configure time, so even though `bundleRelease` only
        # uses the release config, the debug block at app/build.gradle.kts also
        # runs and its partial-config guard would fail the build if DEBUG_*
        # were only partially populated. DEBUG_KEYSTORE_FILE comes via
        # $GITHUB_ENV from the earlier decode step.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          # Baked into BuildConfig.GEMINI_PROXY_URL — picked up by
          # AppCheckGeminiCallPlanner so the Play APK can route Gemini TTS through
          # the developer-paid Cloud Function proxy when no BYOK key is set.
          # Blank when the secret is unset (forks, CI repos without the proxy
          # deployed): planner falls back to BYOK-only, same as a debug build
          # without geminiProxyUrl in local.properties.
          GEMINI_PROXY_URL: ${{ secrets.GEMINI_PROXY_URL }}
        run: |
          set -o pipefail
          ./gradlew :app:bundleRelease --stacktrace --info 2>&1 | tee -a /tmp/android-build.log

      - name: Upload release AAB
        # Browser-downloadable artifact for manual upload to Play Console — kept
        # even after the auto-upload step below so the AAB is recoverable if the
        # Play upload fails (or for ad-hoc browser uploads to other tracks).
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload AAB to Play Store internal track
        # Push-to-main (or manual workflow_dispatch on main) only; skipped
        # when PLAY_SERVICE_ACCOUNT_JSON isn't set (PLAY_AVAILABLE comes from
        # the "Probe publish secrets" step) so a fresh repo / fork still
        # completes CI. Ordered AFTER the release-AAB artifact upload so a
        # Play API failure (e.g. listing not yet approved, versionCode
        # collision) doesn't gate the artifact behind `success()`. Pinned to
        # a specific commit SHA — bump deliberately.
        if: |
          success() &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' &&
          env.PLAY_AVAILABLE == 'true'
        uses: r0adkll/upload-google-play@a80b0bcdcfdfcc2d026f2bc73f726760b2cbc967 # post-v1.1.5: fixes DEP0040/DEP0169 Node.js deprecation warnings
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.clothescast
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/whatsnew

      - name: Clear prior CI comments for this job
        # Same rationale as the JVM job — drops stale failure comments on a
        # clean re-run so the PR doesn't accumulate.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- ci-android-build -->';
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            for (const c of comments) {
              if (c.user.type === 'Bot' && c.body && c.body.includes(marker)) {
                await github.rest.issues.deleteComment({
                  ...context.repo,
                  comment_id: c.id,
                });
              }
            }

      - name: Post tail of gradle log on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '_(no log captured)_';
            try {
              const log = fs.readFileSync('/tmp/android-build.log', 'utf8');
              const lines = log.split('\n');
              const errorLines = lines.filter(l =>
                /^(e:|w:| {2}error:|FAILURE:|\* What went wrong:|Caused by:|Compilation error)/.test(l)
              ).slice(0, 80);
              const tail = lines.slice(-300).join('\n');
              body = '<!-- ci-android-build --> Android debug build failed.\n\n' +
                '### Likely error lines\n```\n' + (errorLines.join('\n') || '(none matched)') + '\n```\n' +
                '### Last 300 lines\n```\n' + tail + '\n```';
            } catch (e) {
              body = 'Android debug build failed before gradle started: ' + e.message;
            }
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: /tmp/android-build.log
          retention-days: 14
