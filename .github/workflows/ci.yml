name: CI

on:
  # Don't trigger on pushes to feature branches — pull_request covers those.
  # Without this, every commit on a PR branch fires CI twice (once for `push`
  # to the branch, once for `pull_request`), and the two runs race on the
  # shared Gradle cache so one frequently fails while the other passes.
  #
  # paths: skip CI when a push/PR only touches top-level dotfiles or
  # hidden directories (.claude/, .gitignore, .editorconfig, .github/
  # ISSUE_TEMPLATE, dependabot.yml, …). Agent-config / repo-metadata
  # changes don't move app or build logic, so the ~5min CI cycle is
  # wasted there. A push that mixes a dotfile change with any non-
  # dotfile path still runs (the include `**` matches the non-dotfile).
  #
  # Uses `paths` (with `!` negations) rather than `paths-ignore` because
  # `paths-ignore` is documented as exclude-only — combining include
  # and exclude requires the `paths` form per GitHub's workflow syntax
  # docs. Patterns evaluate in order, with later overriding earlier:
  #   1. `**`                     — default, every path triggers
  #   2. `!.*` / `!.*/**`         — …except top-level dotfiles + hidden dirs
  #   3. `.github/workflows/**`   — …re-include this file's peers, since
  #                                 a workflow-only PR IS exactly what
  #                                 CI most needs to validate.
  push:
    branches: [main]
    paths:
      - '**'
      - '!.*'
      - '!.*/**'
      - '.github/workflows/**'
  # No paths filter on pull_request, deliberately: the main ruleset requires
  # the `gate` check, and a required check that never reports blocks the PR
  # forever — which is exactly what a path-filtered-out workflow produces.
  # Housekeeping-only PRs (now including markdown-only ones, which used to
  # run full CI) skip the heavy jobs via `classify` instead, and `gate`
  # verifies the skip was justified (scripts/docs-lane.sh has the rationale).
  pull_request:
  # Two dispatch callers. (1) Release rescue: re-fire the release-AAB /
  # Firebase / Play-upload steps from the Actions tab against main when the
  # natural push run failed transiently — no pr input. (2) The
  # snapshot-regen step: its GITHUB_TOKEN push starts no workflow run, so it
  # dispatches CI onto the head it just pushed, naming its PR — or the
  # required `gate` check would exist only on the regenerated commit's
  # parent. A dispatch that names a PR is bound to it (head SHA verified,
  # sole open PR verified, merge-ref build in android-build); one that
  # doesn't is allowed only on main. scripts/docs-lane.sh enforces that.
  workflow_dispatch:
    inputs:
      pr:
        description: >-
          Pull request number this run reports for (the snapshot-regen
          dispatch sets it; leave empty only for a release rescue on main).
        required: false

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on PR branches, but let main runs finish: a
  # second merge landing mid-run could otherwise cancel the first between
  # its Firebase distribution and Play upload steps, skipping a publish.
  # (The release-notes base logic self-heals the changelog either way; the
  # cost was the skipped publish itself.)
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Explicitly empty, not omitted: every job below declares its own downscoped
# block, so this grants nothing itself — it exists so a future job that
# forgets its own block gets no ambient token instead of silently inheriting
# the repository's default GITHUB_TOKEN permission.
permissions: {}

jobs:
  # Decides whether the heavy jobs may skip: true only when every changed
  # file in the PR is housekeeping (see scripts/docs-lane.sh for the rule).
  # Pushes to main and PR-less rescue dispatches are always classified as
  # code, so they run everything; a dispatch that names a PR classifies that
  # PR's real diff, exactly as the PR run would.
  classify:
    name: Classify the diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.run.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Self-test the lane rules
        # A broken rule fails here, the heavy jobs skip on the failed
        # dependency, and the gate goes red — fail closed, never green.
        run: bash scripts/docs-lane.test.sh
      - name: Classify
        id: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: scripts/docs-lane.sh classify >> "$GITHUB_OUTPUT"

  unit-tests:
    name: JVM unit tests
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    permissions:
      # contents: write so the snapshot-commit step can push regenerated PNGs
      # back to the PR branch. GITHUB_TOKEN-authored commits do not trigger new
      # workflow runs (GitHub safety mechanism), so there's no infinite loop.
      contents: write
      pull-requests: write
      # So the snapshot-commit step can dispatch CI onto the head it just
      # pushed — without a run there, the required `gate` never reports on
      # the regenerated commit. The regen path only runs on same-repo PRs,
      # whose author already has push access, so this widens nothing.
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          # `app/build.gradle.kts` derives `versionCode` from
          # `git rev-list --count HEAD`. Shallow clones return 1 every time,
          # so every build would collide on versionCode 1.
          fetch-depth: 0
          # Check out the PR's actual head ref (not the merge commit's detached
          # HEAD) so the snapshot-commit step below can `git push` back to it.
          # Falls back to the default ref outside PRs (push-to-main runs).
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        # AGP must be loadable for Gradle to configure :app, even when only
        # running :core:* tasks. Pre-installing platform 37 + build-tools 36.0.0
        # avoids on-demand downloads at configure time.
        # Pinned to a specific commit SHA (rather than the floating @v4 tag)
        # so a compromised upstream release can't silently swap in malicious
        # code on our next CI run — same discipline as the FAD / Play upload
        # actions below. SHA is android-actions/setup-android v4.0.1.
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Decode google-services.json from secret
        # The Firebase Gradle plugins (gms-google-services + crashlytics) are
        # applied conditionally on `app/google-services.json` being present —
        # see app/build.gradle.kts. Materialising the file here makes the
        # plugins apply on CI, so unit-tests and android-build see the same
        # plugin state. Without this, the file is absent in CI sandboxes
        # (it's .gitignore-d) and the SDKs no-op via
        # FirebaseApp.getApps(...).isEmpty() at runtime — which is correct,
        # just silently telemetry-less. Skipped quietly when the secret
        # isn't set (fork PR / fresh repo).
        #
        # Auto-detects whether the secret holds raw JSON or base64. This
        # repo's other binary secrets (DEBUG_KEYSTORE_BASE64,
        # UPLOAD_KEYSTORE_BASE64) must be base64 because they're binary;
        # google-services.json is text, so pasting it raw works too and is
        # one fewer step at setup time. Either shape is accepted.
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "No GOOGLE_SERVICES_JSON secret available; build will skip Firebase plugins."
            exit 0
          fi
          # Strip surrounding whitespace so a stray newline at the end of a
          # paste (or default 76-col-wrapped base64) doesn't trip strict
          # decoders. A leading `{` after stripping means the user pasted
          # raw JSON — write it through. Otherwise treat as base64.
          trimmed="$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]')"
          first_char="$(printf '%s' "$trimmed" | head -c 1)"
          if [ "$first_char" = "{" ]; then
            echo "Detected raw JSON in secret; writing through without base64 decode."
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            if ! printf '%s' "$trimmed" | base64 --decode > app/google-services.json 2>/dev/null; then
              echo "::error::Failed to base64-decode GOOGLE_SERVICES_JSON. Re-create the secret with the OUTPUT of \`base64 -w0 app/google-services.json\` (Linux) or \`base64 -i app/google-services.json | tr -d '\\n'\` (macOS). Or paste the JSON file contents directly — auto-detect handles either shape."
              exit 1
            fi
          fi
          # Sanity-check the result so a wrong-file paste fails here rather
          # than as a confusing gms-plugin "JSON parse error" several
          # minutes into gradle. Report byte count so a truncated paste is
          # obvious from the log.
          bytes="$(wc -c < app/google-services.json | tr -d ' ')"
          if ! grep -q '"project_info"' app/google-services.json || \
             ! grep -q '"client"'       app/google-services.json; then
            echo "::error::app/google-services.json (${bytes} bytes) is missing project_info / client keys — secret value isn't a valid Firebase config JSON or paste was truncated."
            exit 1
          fi
          echo "google-services.json materialised (${bytes} bytes)."

      - name: Run unit tests
        id: gradle
        run: |
          set -o pipefail
          ./gradlew :core:domain:test :core:data:test :app:testDebugUnitTest --stacktrace --info 2>&1 | tee /tmp/jvm-tests.log

      - name: Clear prior CI comments for this job
        # Runs on both pass and fail. A green run on a fix commit removes the
        # earlier failure comment, so the PR conversation doesn't accumulate
        # stale stack traces every time someone pushes a typo and then fixes it.
        # Skipped on cancellation so a manually-cancelled run doesn't wipe the
        # comment from a still-real failure.
        #
        # continue-on-error: tidying the conversation must never decide the
        # job's outcome — a stale comment left behind is a cosmetic annoyance,
        # a red run on passing tests is not. The catch below still names the
        # reason, so "the old comment is still there" is never unexplained.
        continue-on-error: true
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- ci-jvm-tests -->';
            try {
              // paginate, not per_page: 100 — past 100 comments on a PR the
              // marker falls off page one and stale failure comments survive
              // every later run.
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
              for (const c of comments) {
                if (c.user.type === 'Bot' && c.body && c.body.includes(marker)) {
                  await github.rest.issues.deleteComment({
                    ...context.repo,
                    comment_id: c.id,
                  });
                }
              }
            } catch (e) {
              core.warning(`Could not clear prior JVM-test comments (${e.message}); an earlier failure comment may still be on the PR.`);
            }

      - name: Post tail of gradle log on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ci-jvm-tests -->';
            // GitHub rejects comment bodies over 65536 characters, and 300
            // lines of `--info` output can clear that on its own. An
            // over-long body doesn't truncate, it 422s — losing the whole
            // comment, which AGENTS.md reads as "the failure happened before
            // the tests ran" and points the next reader at the wrong stage.
            // So budget the body: keep the matched error lines, give the log
            // tail whatever is left, and say the artifact has the rest.
            const LIMIT = 60000;
            const trimmed = '\n\n_Trimmed — the full log is in the `test-reports` artifact._';
            let body = `${marker} JVM unit tests failed before gradle started.`;
            try {
              const lines = fs.readFileSync('/tmp/jvm-tests.log', 'utf8').split('\n');
              const errorLines = lines.filter(l =>
                /^(e:|w:| {2}error:|FAILURE:|\* What went wrong:|Caused by:|Compilation error)/.test(l)
              ).slice(0, 80).join('\n') || '(none matched)';
              const head = `${marker} JVM unit tests failed.\n\n` +
                '### Likely error lines\n```\n' + errorLines + '\n```\n' +
                '### Last 300 lines\n```\n';
              // Keep the *end* of the tail: the last frames of a stack trace
              // beat its first, and gradle's "What went wrong" comes late.
              let tail = lines.slice(-300).join('\n');
              const budget = LIMIT - head.length - '\n```'.length - trimmed.length;
              const overflowed = tail.length > budget;
              if (overflowed) tail = tail.slice(-Math.max(budget, 0));
              body = head + tail + '\n```' + (overflowed ? trimmed : '');
              // Backstop for the case the head alone overflows (80 very long
              // error lines). Slicing from the front keeps the marker, which
              // the clear-prior-comments step needs to find this later.
              const suffix = '\n```' + trimmed;
              if (body.length > LIMIT) body = body.slice(0, LIMIT - suffix.length) + suffix;
            } catch (e) {
              body = `${marker} JVM unit tests failed before gradle started: ${e.message}`;
            }
            try {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            } catch (e) {
              // Warn rather than rethrow: the job is already red from the real
              // failure, and replacing that annotation with an API error helps
              // nobody. A warning still says why no comment appeared.
              core.warning(`Could not post the failing-test comment (${e.message}); the log is in the job output above and in the test-reports artifact.`);
            }

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            /tmp/jvm-tests.log
          retention-days: 14

      - name: Commit regenerated UI snapshots back to PR branch
        # Roborazzi renders every @Preview to PNG under app/snapshots/
        # (a tracked path). When a UI change shifts pixels, this step commits
        # the new PNGs back to the PR branch so the diff shows up natively in
        # GitHub's "Files changed" image view — no artifact download needed.
        #
        # Same-repo PRs only: forks don't have token write access to the head
        # repo, so the conditional skips them (the artifact upload below is
        # the fallback there). The step is also skipped on push-to-main, where
        # there's no PR branch to update.
        #
        # Loop safety: GITHUB_TOKEN-authored commits don't trigger new workflow
        # runs, and the `git diff --quiet` check no-ops when nothing changed,
        # so reruns and identical re-records don't create empty churn commits.
        # That's why the commit message below intentionally does NOT carry
        # `[skip ci]`: GITHUB_TOKEN already prevents the PR-branch loop, and
        # adding `[skip ci]` would only cause harm — when the snapshot-regen
        # commit ends up as the head of a rebase-merge to `main`, GitHub
        # natively skips the push-to-main run on `[skip ci]`, and the
        # release-AAB / Firebase / Play-upload steps never fire for that SHA.
        #
        # Records SNAPSHOT_COMMIT_SHA / SNAPSHOTS_REGENERATED into the env so
        # the freshness-comment step downstream can report what happened.
        id: snapshot_commit
        if: >-
          success() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          # Pass the PR branch name through an env var rather than expanding
          # `${{ github.event.pull_request.head.ref }}` directly into the
          # shell script: git's check-ref-format allows characters like `'`,
          # `$`, `;`, `|`, `&` and backticks in branch names, so a same-repo
          # collaborator could create a branch named e.g. `feat';evil;'` and
          # have it injected as shell code via the `git push` line below.
          # As an env var, the value is exposed to the shell as data and
          # safely quoted at the use site.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          # The `gh workflow run` dispatch below authenticates through
          # GH_TOKEN; without it the fresh runner's gh is unauthenticated
          # (the job's `actions: write` grants the token scope, not the CLI
          # its credential), the dispatch fails after the push has already
          # moved the PR head, and the required gate never reports for the
          # refreshed commit.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -d app/snapshots ]; then
            # Remove PNGs for deleted or renamed @Test methods (orphaned snapshots).
            # Auto-discover every Kotlin test source — snapshot tests write to
            # "$outputDir/<methodName>.png", so a PNG whose basename matches no
            # @Test method anywhere in app/src/test is genuinely orphaned. The
            # previous version hard-coded a snapshot_sources list and silently
            # deleted PNGs whose test file wasn't on it (db7aaf8 → 25cfc6d:
            # SettingsClothesFullSnapshot.kt's snapshot survived the test pass
            # only to be wiped here on the way to commit). Scanning every test
            # file zero-configures any future snapshot file.
            # Slurped perl match handles both `@Test fun foo()` and
            # multi-line `@Test\n@Config(...)\nfun foo()` styles — a single-line
            # `(?<=@Test fun )` regex misses the latter and would prune the PNG
            # as orphaned even though the test still runs.
            # Scan every test source root, including variant-specific
            # ones like `src/testDebug/` (added 2026-05 for the App Check
            # debug-token snapshot). Missing a source root here silently
            # marks every PNG only that root's tests record as orphaned
            # and deletes it on the next CI regen — the bug behind PR
            # #905's first regen wiping
            # `settings_voice_app_check_debug_token.png`. Roots are
            # enumerated with find -name rather than a shell glob: an
            # unmatched glob (`app/src/test[A-Z]*` with no variant roots
            # present) passes through literally, find exits non-zero, and
            # `set -euo pipefail` would kill the step.
            expected=$(find app/src -maxdepth 1 -type d \( -name 'test' -o -name 'test[A-Z]*' \) -print0 \
              | xargs -0 -r -I{} find {} -name '*.kt' -print0 \
              | xargs -0 -r perl -0777 -ne 'while (/\@Test\b(?:\s|\@\w+(?:\([^)]*\))?)*?\bfun\s+(\w+)/g) { print "$1\n" }')
            for png in app/snapshots/*.png; do
              [ -f "$png" ] || continue
              name=$(basename "$png" .png)
              if ! echo "$expected" | grep -qxF "$name"; then
                rm "$png"
                echo "Removed orphaned snapshot: $name.png"
              fi
            done
            # Stage new files, modifications, AND deletions.
            git add -A app/snapshots
          fi
          if git diff --cached --quiet; then
            echo "No snapshot changes."
            echo "SNAPSHOTS_REGENERATED=false" >> "$GITHUB_ENV"
            echo "SNAPSHOT_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            exit 0
          fi
          git commit -m "ci: regenerate UI snapshots"
          git push origin "HEAD:$HEAD_REF"
          # The push above starts no workflow run — GITHUB_TOKEN pushes never
          # do — so dispatch CI onto the new head or the required `gate`
          # blocks the PR forever, silently. Fail loudly if it doesn't take.
          if ! gh workflow run ci.yml --ref "$HEAD_REF" -f pr="${{ github.event.pull_request.number }}"; then
            echo "::error::Pushed regenerated snapshots but could not start CI on them (is workflow_dispatch with the pr input on main yet?). Dispatch CI on the branch by hand from the Actions tab."
            exit 1
          fi
          echo "SNAPSHOTS_REGENERATED=true" >> "$GITHUB_ENV"
          echo "SNAPSHOT_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Comment snapshot freshness on PR
        # Sticky comment (single per-PR, updated in place via the marker) so
        # reviewers always know whether the PNGs in the PR's "Files changed"
        # tab are current. Three signals:
        #   - whether *this* run regenerated PNGs (vs reused unchanged ones)
        #   - the head SHA the snapshots were rendered against
        #   - the count of PNGs (catches the silent case where a renamed
        #     @Test method writes to a new file and old PNGs go stale)
        #
        # continue-on-error: the snapshots are committed to the branch and in
        # the ui-preview-snapshots artifact either way, so a GitHub API hiccup
        # must not turn a passing test job red over a status comment. The
        # catch below raises a ::warning::, so a missing comment always has a
        # reason in the log rather than being swallowed by continue-on-error.
        continue-on-error: true
        if: >-
          success() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = 'app/snapshots';
            let count = 0;
            try {
              count = fs.readdirSync(path).filter(f => f.endsWith('.png')).length;
            } catch (e) {
              // Directory missing — first PR before any snapshot has been
              // recorded. Report 0 so the user sees the situation clearly.
            }
            const headSha = (process.env.SNAPSHOT_COMMIT_SHA || context.sha).slice(0, 7);
            const regenerated = process.env.SNAPSHOTS_REGENERATED === 'true';
            const status = regenerated
              ? `🔄 Regenerated ${count} UI snapshot${count === 1 ? '' : 's'} this run.`
              : `✅ ${count} UI snapshot${count === 1 ? '' : 's'} up-to-date — no pixel changes from this push.`;
            const body = `<!-- ui-snapshots-status -->
            **UI snapshots:** ${status}

            Head: \`${headSha}\` · Browse: [\`app/snapshots/\`](https://github.com/${context.repo.owner}/${context.repo.repo}/tree/${context.payload.pull_request.head.ref}/app/snapshots)`;
            const marker = '<!-- ui-snapshots-status -->';
            // The lookup can't fail open the way the update/create below can:
            // its result picks update-vs-create, so an error swallowed into
            // "not found" doesn't lose the comment, it posts a *duplicate* —
            // and every later run duplicates again. Let a lookup failure skip
            // the comment entirely; one run's status line is cheaper than a
            // pile of them. `paginate` for the same reason: past 100 comments
            // the marker falls off page one and reads as a genuine no-match.
            let comments;
            try {
              comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
            } catch (e) {
              core.warning(`Could not list PR comments (${e.message}); skipping the snapshot-freshness comment rather than risking a duplicate.`);
              return;
            }
            const existing = comments.find(c => c.user.type === 'Bot' && c.body && c.body.includes(marker));
            try {
              if (existing) {
                await github.rest.issues.updateComment({
                  ...context.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            } catch (e) {
              core.warning(`Could not post the snapshot-freshness comment (${e.message}); the snapshots are committed to the branch and in the ui-preview-snapshots artifact.`);
            }

      - name: Post snapshot image diffs as a PR comment
        # The GitHub mobile app shows "Binary files not rendered" for any
        # binary diff, so PNG changes in the Files tab — including the
        # snapshot-regen bot's commits — are invisible from a phone. This
        # step upserts a single marker-tagged PR comment embedding every
        # added / changed / removed snapshot inline, with image URLs pinned
        # to commit SHAs (before → the PR merge-base, after → the branch
        # head incl. any regen commit just pushed above). Markdown-embedded
        # images render fine in the mobile app even though file diffs don't.
        #
        # Upsert (PATCH the existing marker comment) rather than re-post so
        # repeated pushes don't pile up comments; when a later push reverts
        # every snapshot change, the stale comment is rewritten to say so
        # instead of being left describing a diff that no longer exists.
        # Automates the hand-posted comments AGENTS.md used to prescribe,
        # which historically suffered typo'd / stale-SHA image URLs.
        #
        # Same-repo PRs only: forks don't get token write access to post
        # comments (the ui-preview-snapshots artifact below is the fallback
        # there). Diff is taken against the merge-base so snapshots
        # committed earlier on the branch (e.g. recorded locally) show up
        # too, not just this run's regen.
        #
        # continue-on-error: a transient GitHub API failure must not turn a
        # passing test job red over a convenience comment — the PNGs are
        # already committed to the branch and in the ui-preview-snapshots
        # artifact. Every API call below still checks its own status and
        # raises a ::warning::, so "no diff comment appeared" always has a
        # reason in the job log rather than being swallowed here.
        continue-on-error: true
        if: >-
          success() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker='<!-- ui-snapshot-diffs -->'
          base_sha=$(git merge-base HEAD "origin/${GITHUB_BASE_REF}")
          head_sha=$(git rev-parse HEAD)

          # --no-renames keeps statuses to a single-path A/M/D shape (a
          # rename would otherwise emit R100 with two tab-separated paths).
          mapfile -t entries < <(git diff --name-status --no-renames \
            "$base_sha" HEAD -- app/snapshots/ | grep -E '^[AMD]' || true)

          # The lookup can't fail open the way the PATCH/POST below can. Its
          # result picks update-vs-create, so an error swallowed into an empty
          # id doesn't lose the comment — it posts a *duplicate*, and every
          # later run duplicates again. So on any lookup failure, skip the
          # comment entirely rather than guessing: skipping costs one run's
          # diff, guessing wrong leaves a pile. `--paginate` for the same
          # reason — past 100 comments the marker falls off page one and
          # reads as a genuine no-match. With --paginate the jq filter runs
          # per page, so emit ids as lines and take the first rather than
          # indexing into one page's array.
          if ! ids=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            --jq ".[] | select((.user.type == \"Bot\") and ((.body // \"\") | contains(\"$marker\"))) | .id"); then
            echo "::warning::Could not list PR comments; skipping the snapshot-diff comment rather than risking a duplicate. The snapshots are committed to the branch and in the ui-preview-snapshots artifact."
            exit 0
          fi
          existing="${ids%%$'\n'*}"

          if [ ${#entries[@]} -eq 0 ]; then
            if [ -n "$existing" ]; then
              # A previous push changed snapshots and a later one reverted
              # them — rewrite the comment so it doesn't lie.
              revert_body="$marker"$'\n'"**UI snapshot diffs:** all snapshot changes reverted — no differences vs merge-base as of \`${head_sha:0:7}\`."
              if gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
                -f body="$revert_body" > /dev/null; then
                echo "No snapshot changes; updated stale diff comment ${existing}."
              else
                echo "::warning::Could not rewrite the stale snapshot-diff comment ${existing}; it still describes a diff that no longer exists."
              fi
            else
              echo "No added/changed/removed snapshots vs merge-base; skipping comment."
            fi
            exit 0
          fi

          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}"
          body="$marker"$'\n'"## UI snapshot diffs"$'\n\n'
          body+="Auto-posted by CI. After images pinned to \`${head_sha:0:7}\`, before images to the merge-base \`${base_sha:0:7}\`."$'\n'
          count=0
          for entry in "${entries[@]}"; do
            status="${entry%%$'\t'*}"
            path="${entry#*$'\t'}"
            name=$(basename "$path")
            count=$((count+1))
            # GitHub caps comment bodies at 65536 chars; 20 entries of
            # URL-heavy markdown stays comfortably under it.
            if [ "$count" -gt 20 ]; then
              body+=$'\n'"_…truncated: more than 20 snapshot changes; see the \`ui-preview-snapshots\` artifact or browse \`app/snapshots/\` at \`${head_sha:0:7}\`._"
              break
            fi
            case "$status" in
              A)
                body+=$'\n'"**Added — \`${name}\`**"$'\n\n'"<img src=\"${raw}/${head_sha}/${path}\" width=\"320\">"$'\n'
                ;;
              D)
                body+=$'\n'"**Removed — \`${name}\`** (was)"$'\n\n'"<img src=\"${raw}/${base_sha}/${path}\" width=\"320\">"$'\n'
                ;;
              *)
                body+=$'\n'"**Changed — \`${name}\`**"$'\n\n'"| Before | After |"$'\n'"| --- | --- |"$'\n'"| <img src=\"${raw}/${base_sha}/${path}\" width=\"320\"> | <img src=\"${raw}/${head_sha}/${path}\" width=\"320\"> |"$'\n'
                ;;
            esac
          done

          # A failed PATCH/POST can fail open — nothing is duplicated, the
          # comment just doesn't appear — but it must still say why, or the
          # only symptom is a reviewer wondering where the visual diff went.
          if [ -n "$existing" ]; then
            if gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
              -f body="$body" > /dev/null; then
              echo "Updated snapshot-diff comment ${existing}."
            else
              echo "::warning::Could not update snapshot-diff comment ${existing}; the snapshots are committed to the branch and in the ui-preview-snapshots artifact."
            fi
          else
            if gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f body="$body" > /dev/null; then
              echo "Posted new snapshot-diff comment."
            else
              echo "::warning::Could not post the snapshot-diff comment; the snapshots are committed to the branch and in the ui-preview-snapshots artifact."
            fi
          fi

      - name: Upload UI preview snapshots (fallback for fork PRs)
        # Same PNGs as the in-repo commit above, kept as a workflow artifact
        # so reviewers on a fork PR (where the commit-back step is skipped
        # for lack of token write access) can still download and eyeball them.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-preview-snapshots
          path: app/snapshots/
          if-no-files-found: ignore
          retention-days: 14

  # The npm-update workflow's publish job trusts
  # scripts/check-npm-update.mjs to re-validate each weekly batch, so
  # that script's suite runs here — the only gate between a change to those
  # rules and the next Saturday run. No install step, because there is
  # nothing to install: the checker, the vitest shim, and their tests are
  # dependency-free on purpose. Skips on docs-only diffs under the same rule
  # as the other jobs, so the gate's all-success-or-all-skipped check holds.
  checker-tests:
    name: Dependency checker tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: functions/package.json
      - name: Test
        run: node --test scripts/*.test.js

  # npm-update.yml's own checks (`npm ci`, `npm run build`) run on the
  # update job's untrusted runner, before the PR exists — evidence the
  # publish job trusts but this workflow never re-proves. This job is that
  # proof: it's the only required check that actually installs and builds
  # `functions/` for the head commit gate protects, so a batch that somehow
  # slipped past those checks, or a branch edited after the checks ran,
  # cannot merge on a stale verdict.
  functions-build:
    name: Functions install and build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: functions/package.json
      - name: Install
        working-directory: functions
        run: npm ci
      - name: Build
        working-directory: functions
        run: npm run build

  android-build:
    name: Android debug build
    runs-on: ubuntu-latest
    needs: classify
    permissions:
      contents: read
      pull-requests: write
      # Needed by the "Prepare release notes" step's Actions-API fallback,
      # which queries the most recent successful main CI run when
      # `github.event.before` isn't usable (workflow_dispatch, first push
      # to a fresh branch).
      actions: read
    # workflow_dispatch can be invoked against any ref by any user with
    # `actions: write`; a manual dispatch against a feature branch that
    # ships a malicious `ci.yml` modification would otherwise have job
    # secrets in scope. push events are already filtered to main by the
    # `on:` block, and pull_request secrets are blocked by GitHub for fork
    # PRs — but *same-repo* PRs still receive secrets unless we gate
    # individual secret-loading steps to main (see the "Probe publish
    # secrets" / debug-keystore-decode / Firebase / Play steps below,
    # each of which `if:`-gates secret access to push/dispatch on main).
    # A PR-named dispatch (the snapshot-regen relaunch) is admitted off main:
    # docs-lane.sh binds it to the PR's own head, and the secret-loading
    # steps below stay individually gated to push/dispatch on main, so no
    # secret is in scope on a branch either way.
    if: |
      needs.classify.outputs.docs_only != 'true' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || inputs.pr != '')
    steps:
      - uses: actions/checkout@v5
        with:
          # See unit-tests job above — versionCode comes from rev-list --count.
          fetch-depth: 0
          # A dispatch that names a PR builds that PR's merge ref, not the
          # bare branch — otherwise a dispatch could green the gate without
          # compiling the PR-merged tree.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.pr != '' && format('refs/pull/{0}/merge', inputs.pr) || '' }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        # SHA-pinned — see rationale on the unit-tests job's copy of this step.
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Decode google-services.json from secret
        # See unit-tests job for the rationale and the raw-vs-base64
        # auto-detect. Decoding both here and there keeps the Firebase
        # plugin state consistent across jobs.
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "No GOOGLE_SERVICES_JSON secret available; APK will be built without Firebase config."
            exit 0
          fi
          trimmed="$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]')"
          first_char="$(printf '%s' "$trimmed" | head -c 1)"
          if [ "$first_char" = "{" ]; then
            echo "Detected raw JSON in secret; writing through without base64 decode."
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            if ! printf '%s' "$trimmed" | base64 --decode > app/google-services.json 2>/dev/null; then
              echo "::error::Failed to base64-decode GOOGLE_SERVICES_JSON. Re-create the secret with the OUTPUT of \`base64 -w0 app/google-services.json\` (Linux) or \`base64 -i app/google-services.json | tr -d '\\n'\` (macOS). Or paste the JSON file contents directly — auto-detect handles either shape."
              exit 1
            fi
          fi
          bytes="$(wc -c < app/google-services.json | tr -d ' ')"
          if ! grep -q '"project_info"' app/google-services.json || \
             ! grep -q '"client"'       app/google-services.json; then
            echo "::error::app/google-services.json (${bytes} bytes) is missing project_info / client keys — secret value isn't a valid Firebase config JSON or paste was truncated."
            exit 1
          fi
          echo "google-services.json materialised (${bytes} bytes)."

      - name: Decode debug keystore from secret
        # Stable signing identity across CI builds so the installed app upgrades
        # in place instead of failing "App not installed (signature mismatch)"
        # on every new APK. Gated to push / workflow_dispatch on main only:
        # PR `assembleDebug` runs (incl. same-repo PRs) deliberately don't
        # decode this keystore so a malicious Gradle modification in a PR
        # can't exfiltrate DEBUG_KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
        # or read /tmp/debug.keystore. AGP falls back to its auto-generated
        # debug keystore on PR builds — the APK still builds and runs, just
        # without the stable signing identity. FAD distribution is main-only
        # anyway (see Firebase step below), so PR-built APKs aren't pushed
        # to testers and the lost in-place-upgrade property doesn't matter.
        # Skipped quietly when DEBUG_KEYSTORE_BASE64 isn't set (fresh repo).
        #
        # On success this step propagates all four DEBUG_* values to
        # $GITHUB_ENV so the Assemble step below picks them up without
        # re-referencing secrets — i.e. secrets enter this job's process
        # environment only in this step (main-gated), nowhere else.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "No DEBUG_KEYSTORE_BASE64 secret available; build will use AGP-default debug keystore."
            exit 0
          fi
          # If one stable-keystore secret is set, all four must be set. Otherwise
          # gradle later errors with "Partial debug-keystore configuration", but
          # the decode step itself would also throw a confusing keytool message
          # in the meantime. Catch it here with an explicit list of what's
          # missing so the failure is unambiguous.
          missing=""
          [ -z "$DEBUG_KEYSTORE_PASSWORD" ] && missing="$missing DEBUG_KEYSTORE_PASSWORD"
          [ -z "$DEBUG_KEY_ALIAS" ]         && missing="$missing DEBUG_KEY_ALIAS"
          [ -z "$DEBUG_KEY_PASSWORD" ]      && missing="$missing DEBUG_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 is set but the following companion secrets are missing or empty:$missing"
            exit 1
          fi
          # printf rather than echo: portable across shells and doesn't append
          # a trailing newline that some base64 implementations choke on.
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > /tmp/debug.keystore
          # Validate the decoded file is actually a usable PKCS12/JKS keystore
          # with the configured password, rather than just non-empty bytes.
          # Catches "wrong base64", "wrong password", "uploaded a JPEG by
          # mistake" — at the early-fail step, not at signing-step time.
          if ! keytool -list -keystore /tmp/debug.keystore -storepass "$DEBUG_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Decoded keystore at /tmp/debug.keystore is not a valid keystore or DEBUG_KEYSTORE_PASSWORD is wrong."
            exit 1
          fi
          # Propagate to $GITHUB_ENV so the Assemble step picks them up
          # without itself referencing `${{ secrets.* }}`. Values are still
          # masked in logs (`add-mask` was applied when GitHub injected them
          # as `env:` here). Heredoc form is robust if a value ever contains
          # newlines; KEY_ALIAS realistically won't, but uniform style is
          # cheaper than knowing-the-edge-cases.
          {
            echo "DEBUG_KEYSTORE_FILE=/tmp/debug.keystore"
            printf 'DEBUG_KEYSTORE_PASSWORD<<__EOF__\n%s\n__EOF__\n' "$DEBUG_KEYSTORE_PASSWORD"
            printf 'DEBUG_KEY_ALIAS<<__EOF__\n%s\n__EOF__\n' "$DEBUG_KEY_ALIAS"
            printf 'DEBUG_KEY_PASSWORD<<__EOF__\n%s\n__EOF__\n' "$DEBUG_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Assemble debug APK
        # No step-level `env:` referencing secrets here: on main, the four
        # DEBUG_* env vars arrive via $GITHUB_ENV from the decode step
        # above; on PRs (where the decode step is skipped) they're absent
        # and AGP's signingConfigs block in app/build.gradle.kts falls back
        # to the auto-generated debug keystore. This keeps PR builds from
        # ever seeing the secret values in their gradle process.
        id: gradle
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --info 2>&1 | tee /tmp/android-build.log

      - name: Upload debug APK
        # Up here, before the release-AAB steps, so a bundleRelease failure
        # doesn't gate this artifact behind a now-failed `success()`.
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Prepare release notes for FAD and Play
        # Single source of truth for "what changed in this build" copy. Both
        # Firebase App Distribution (tester push-notification + release page)
        # and Play Store internal track (whatsnew-en-US) ship this string to
        # humans, so they MUST agree — and they MUST be a curated, end-user
        # bullet list, not raw head-commit content.
        #
        # Lists every commit's subject as a `• `-prefixed bullet, oldest →
        # newest, for the range between the previous *released* main build
        # and this one. We deliberately don't use `github.event.before` as
        # the range base: if a prior main push failed before distribution,
        # `before` would be that failed-push tip and the next run's notes
        # would silently omit the unreleased commits from the failed run.
        # The Actions API gives us "last *released* tip" instead — walking
        # main's recent workflow runs newest-first and picking the first
        # one whose `android-build` job succeeded AND actually published
        # (its FAD or Play upload *step* concluded success). Gating on
        # the job rather than the workflow run matters because
        # `unit-tests` and `android-build` run in parallel without
        # `needs:` and the publish steps live only in `android-build`: a
        # run where `unit-tests` fails but `android-build` succeeds DID
        # publish, so its head SHA is the right base — querying the
        # workflow's overall conclusion would skip it and double-bullet
        # its commits in the next fully-green run's notes. Gating on the
        # publish *steps* on top of that matters because the job also
        # concludes green when every publish step skips (publication
        # secrets missing, or RELEASE_NOTES_SKIP on a housekeeping-only
        # push) — counting such a run as released would drop its range's
        # commits from the next real release. The current run is
        # filtered out (no job conclusion yet); we also skip any prior
        # runs of the same head SHA (manual re-runs). When no prior
        # released build is reachable (fresh repo, fork, history
        # rewrite), the range collapses to the head commit alone.
        #
        # Per-commit filter: a commit's subject is skipped if it would read
        # as noise to a non-engineer — anything prefixed `ci:` (the
        # snapshot-regen bot commits "ci: regenerate UI snapshots", workflow
        # tweaks, etc.), `test:` (test-only changes that ship nothing in
        # the APK), or `internal:` (internal-only changes that ship nothing
        # user-visible — refactors, renames, dependency bumps), and changes
        # whose paths are all under `docs/`, all
        # top-level dotfiles or hidden directories (`.github/`, `.claude/`,
        # `.gitignore`, `.editorconfig`, …), or top-level `*.md`. PRIVACY.md
        # is treated as non-docs so that privacy-policy updates still surface
        # to users.
        #
        # When the range yields no bullets (every commit in it was filtered
        # out — e.g. a `.github/workflows/**`-only push, which still
        # triggers main CI per the workflow's `paths:` block), the step
        # sets RELEASE_NOTES_SKIP=true and the FAD + Play upload steps
        # below skip: nothing user-visible shipped, so publishing would
        # buzz testers' phones and burn a Play release for notes recycled
        # from an already-released commit. (This replaces the previous
        # always-publish ancestor-walk fallback, which re-published old
        # subjects exactly in that case — ported from Type Launcher's
        # deploy job. The ancestor walk survives only for the no-base
        # case, where the range was never really examined — see the
        # backstop below.) A manual workflow_dispatch is the exception:
        # it's an explicit "publish the current tip anyway" request, so
        # it falls back to a generic "Internal test build" note instead
        # of skipping. The release-AAB build and artifact upload still
        # run either way.
        #
        # Play's `whatsnew-en-US` is capped at 500 Unicode characters per
        # language; if the bullet list would exceed that, whole trailing
        # bullets are dropped (oldest-first preserved at the head) and a
        # `\n…` marker appended so the user can tell the list was cut —
        # see the truncation block below. A 50-subject cap inside the
        # filter loop is the safety net for unusually long ranges; in
        # practice the 500-char cap bites first.
        #
        # Outputs:
        #   - $RUNNER_TEMP/whatsnew/whatsnew-en-US  (consumed by Play upload)
        #   - $RELEASE_NOTES in $GITHUB_ENV         (multi-line via heredoc;
        #     consumed by the FAD step's releaseNotes input, which composes
        #     it with a `---` divider + `Build: N · SHA` trailer)
        #
        # Gated on push/dispatch to main only — feature-branch CI runs don't
        # distribute, so the prep work would be wasted there. No secret gate:
        # FAD and Play each have their own secret gates downstream, but the
        # notes should be computed even when only one of the two is wired up.
        if: |
          success() &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        env:
          # `gh api` needs the token explicitly; everything else uses the
          # auto-provided $GITHUB_SHA / $GITHUB_REPOSITORY rather than
          # re-aliasing into step-local names.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/whatsnew"
          head_sha="$GITHUB_SHA"

          # Walk the most recent main runs of this workflow (newest first)
          # and pick the head SHA of the first one whose `android-build`
          # job concluded with success AND whose FAD or Play upload step
          # concluded success — a green job alone isn't proof anything
          # published (see the step comment). The job and step names
          # below must match this workflow's `name:` values verbatim —
          # rename in lockstep. Known trade: a run where FAD published
          # but a later step failed the job doesn't count, so FAD
          # testers may see a repeated bullet — better than Play's
          # permanent "What's new" record omitting one.
          prev_sha=""
          while IFS=$'\t' read -r run_id run_head; do
            [ -z "$run_id" ] && continue
            # Skip the current run (in_progress, doesn't have a conclusion
            # yet anyway) and any prior runs of the same head SHA — those
            # are manual re-runs of this commit.
            [ "$run_head" = "$head_sha" ] && continue
            published=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
              --jq '[.jobs[]
                     | select(.name == "Android debug build")
                     | select(.conclusion == "success")
                     | .steps[]
                     | select(.name == "Distribute via Firebase App Distribution"
                              or .name == "Upload AAB to Play Store internal track")
                     | .conclusion]
                    | any(. == "success")' \
              2>/dev/null || true)
            if [ "$published" = "true" ]; then
              prev_sha="$run_head"
              break
            fi
          done < <(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&per_page=100" \
            --jq '.workflow_runs[]? | [.id, .head_sha] | @tsv' \
            2>/dev/null || true)
          # per_page=100 (the API max) keeps this a single call while
          # covering a 100-run red streak; --paginate would fetch the
          # workflow's entire run history on every main build. Deeper
          # than that, the no-base backstop below still applies.

          base_sha=""
          if [ -n "$prev_sha" ] && git cat-file -e "$prev_sha" 2>/dev/null; then
            base_sha="$prev_sha"
          fi

          if [ -n "$base_sha" ]; then
            # Deliberately uncapped: `git rev-list --max-count` limits
            # commits BEFORE `--reverse` applies, so a pre-walk cap would
            # keep the newest N and silently drop the oldest — the exact
            # commits the oldest-first notes must preserve. The safety cap
            # lives on qualifying subjects in the filter loop below.
            mapfile -t shas < <(git rev-list --reverse \
              "$base_sha..$head_sha")
            if [ "${#shas[@]}" -eq 0 ]; then
              shas=("$head_sha")
            fi
          else
            shas=("$head_sha")
          fi

          # Predicate: returns 0 if the commit subject + paths should be
          # filtered out of the changelog. Shared by the range walk and
          # the ancestor-walk fallback below.
          is_noise() {
            local sha="$1" subject non_doc_count
            subject=$(git log -1 --pretty=%s "$sha")
            case "$subject" in
              ci:*|test:*|internal:*|docs:*) return 0 ;;
            esac
            non_doc_count=$(git show --no-renames --name-only --pretty=format: "$sha" \
              | sed '/^$/d' \
              | awk '
                  /^PRIVACY\.md$/ { count++; next }
                  /^docs\//       { next }
                  /^\./           { next }
                  /\.md$/         { next }
                                  { count++ }
                  END             { print count + 0 }
                ')
            [ "$non_doc_count" -eq 0 ]
          }

          subjects=()
          for sha in "${shas[@]}"; do
            [ -z "$sha" ] && continue
            # Safety net for unusually long ranges (release outage),
            # applied AFTER oldest-first ordering so the head of the list
            # is never dropped; in practice the 500-char Play cap
            # truncates far sooner.
            if [ "${#subjects[@]}" -ge 50 ]; then
              echo "Reached 50 qualifying subjects; ignoring the rest of the range."
              break
            fi
            if is_noise "$sha"; then
              continue
            fi
            subjects+=("$(git log -1 --pretty=%s "$sha")")
          done

          # With no usable release base (fresh repo, history rewrite, or a
          # transient Actions API failure) the "range" was only the head
          # commit, so an all-filtered result doesn't prove nothing is
          # unreleased — e.g. a feature commit sitting under a
          # `ci: regenerate UI snapshots` head. Walk up to 20 ancestors
          # for the most recent non-filtered subject as a backstop before
          # deciding to skip; a real range that was all-filtered skips
          # without the walk.
          if [ "${#subjects[@]}" -eq 0 ] && [ -z "$base_sha" ]; then
            walk_sha="$head_sha"
            for _ in $(seq 1 20); do
              git cat-file -e "$walk_sha" 2>/dev/null || break
              if ! is_noise "$walk_sha"; then
                subjects+=("$(git log -1 --pretty=%s "$walk_sha")")
                break
              fi
              walk_sha=$(git rev-parse "$walk_sha^" 2>/dev/null) || break
            done
          fi

          # Range was all-filtered: skip publishing (see the step comment)
          # unless this is a manual dispatch, which publishes the tip with
          # a generic note.
          if [ "${#subjects[@]}" -eq 0 ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "No release-worthy commits, but this is a manual workflow_dispatch — publishing the current tip anyway with a generic note."
              subjects+=("Internal test build")
            else
              echo "No release-worthy commits in this push (all prefixed or docs / dotfile housekeeping); skipping FAD distribution and Play upload."
              echo "RELEASE_NOTES_SKIP=true" >> "$GITHUB_ENV"
              exit 0
            fi
          fi

          # Play's documented per-language cap is 500 Unicode *characters*,
          # not bytes — the previous byte-based cut over-trimmed multibyte
          # text and could slice mid-word. Measure in characters (`wc -m`
          # under a UTF-8 locale, so "• " and "…" score as Play sees them)
          # and drop whole trailing bullets on overflow, appending a "\n…"
          # marker so the reader can tell the list was cut. Oldest-first is
          # preserved at the head. Ported from Type Launcher's deploy job.
          MAX=500
          TRUNC_MARK=$'\n…'
          export LC_ALL=C.UTF-8

          format_notes() {
            local first=1 s
            for s in "$@"; do
              if [ "$first" -eq 1 ]; then
                printf '%s' "• $s"
                first=0
              else
                printf '\n• %s' "$s"
              fi
            done
          }

          char_len() {
            printf '%s' "$1" | wc -m
          }

          # Two-phase: greedy-add subjects until the formatted output would
          # exceed MAX, then, if anything was dropped, append the marker —
          # dropping further bullets if the marker itself overflows. A
          # single subject too long to fit at all is hard-truncated.
          kept=()
          truncated=false
          for s in "${subjects[@]}"; do
            candidate=$(format_notes "${kept[@]}" "$s")
            if [ "$(char_len "$candidate")" -gt "$MAX" ]; then
              truncated=true
              break
            fi
            kept+=("$s")
          done

          if [ "${#kept[@]}" -eq 0 ]; then
            bullets=$(printf '%s' "• ${subjects[0]}" | cut -c 1-499)
            bullets="${bullets}…"
          else
            bullets=$(format_notes "${kept[@]}")
            if [ "$truncated" = true ]; then
              while [ "$(char_len "${bullets}${TRUNC_MARK}")" -gt "$MAX" ] \
                && [ "${#kept[@]}" -gt 0 ]; do
                unset 'kept[${#kept[@]}-1]'
                bullets=$(format_notes "${kept[@]}")
              done
              if [ "${#kept[@]}" -eq 0 ]; then
                bullets=$(printf '%s' "• ${subjects[0]}" | cut -c 1-498)
              fi
              bullets="${bullets}${TRUNC_MARK}"
            fi
          fi

          printf '%s' "$bullets" > "$RUNNER_TEMP/whatsnew/whatsnew-en-US"
          # Random heredoc terminator so a crafted commit subject containing
          # the literal terminator on a line of its own can't inject
          # arbitrary entries into $GITHUB_ENV.
          delim="RELEASE_NOTES_EOF_$(openssl rand -hex 16)"
          {
            printf 'RELEASE_NOTES<<%s\n' "$delim"
            printf '%s\n' "$bullets"
            printf '%s\n' "$delim"
          } >> "$GITHUB_ENV"
          echo "Release notes:"
          printf '%s\n' "$bullets"

      - name: Probe publish secrets
        # Sets FIREBASE_AVAILABLE / PLAY_AVAILABLE boolean flags in
        # $GITHUB_ENV so the downstream FAD and Play upload steps can use
        # them in their `if:` conditions (which can't read `secrets.*`
        # directly). Gated to push / workflow_dispatch on main: this is the
        # ONLY step in this job where FIREBASE_* / PLAY_* secrets are ever
        # expanded into env vars. On PR runs (incl. same-repo) the flags
        # remain unset, the FAD and Play steps short-circuit on the flag
        # check, and their `with:` blocks (which also reference these
        # secrets) are never evaluated — so a malicious Gradle change in
        # a PR has no path to read these secret values from the runner's
        # process environment.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_APP_ID" ] && [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "FIREBASE_AVAILABLE=false" >> "$GITHUB_ENV"
          fi
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "PLAY_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "PLAY_AVAILABLE=false" >> "$GITHUB_ENV"
          fi

      - name: Distribute via Firebase App Distribution
        # On push to main (or manual workflow_dispatch on main) only —
        # feature-branch CI runs would otherwise spam testers with WIP builds.
        # workflow_dispatch is the rescue path when the natural push event
        # was suppressed by `[skip ci]` on the head commit. Skipped when
        # the Firebase secrets aren't set so the build still finishes on a
        # fresh repo / fork — see "Probe publish secrets" above for how the
        # FIREBASE_AVAILABLE flag is computed (only on main, so the secret
        # values never enter the runner env on PRs).
        #
        # Ordered before the release-AAB steps so a bundleRelease failure on
        # main doesn't skip FAD distribution under the `success()` gate — debug
        # testers get the build either way; only the Play AAB artifact is lost.
        #
        # Also requires the stable debug keystore (DEBUG_KEYSTORE_FILE is
        # only set when the decode step above validated one): an APK signed
        # with the runner's throwaway debug key can't install as an update
        # over a previous FAD build (signature mismatch forces an
        # uninstall), so distributing without it does more harm than
        # skipping. Flagged by Codex on Simmo's port of this pipeline
        # (mikelward/simmo#45).
        if: |
          success() &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' &&
          env.FIREBASE_AVAILABLE == 'true' &&
          env.DEBUG_KEYSTORE_FILE != '' &&
          env.RELEASE_NOTES_SKIP != 'true'
        # Pinned to a specific commit SHA (rather than the floating @v1 tag) so
        # a compromised upstream release can't silently swap in malicious code
        # on our next CI run. Bump deliberately. SHA below is wzieba/Firebase-
        # Distribution-Github-Action v1.7.1.
        uses: wzieba/Firebase-Distribution-Github-Action@bd494989dd4bec0343f78adee87fe66e48279ad6 # v1.7.1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          # Tester group must exist in Firebase App Distribution console — see
          # docs/firebase-app-distribution.md. "testers" is the convention; rename
          # there + here together if you change it.
          groups: testers
          file: app/build/outputs/apk/debug/app-debug.apk
          # Push notification on the tester's phone shows the first ~60 chars
          # of these notes — must match what Play Store testers see, which is
          # the curated subject computed in "Prepare release notes" above.
          # Raw `head_commit.message` would be wrong twice over: on a `ci:
          # regenerate UI snapshots` head commit testers would see the bot
          # message, and on a normal feature commit they'd get the full body
          # too (file paths, engineering reasoning), which CLAUDE.md reserves
          # for reviewers, not end users.
          releaseNotes: |
            ${{ env.RELEASE_NOTES }}
            ---
            Build: ${{ github.run_number }} · ${{ github.sha }}

      - name: Decode upload keystore from secret
        # Push-to-main (or manual workflow_dispatch on main) only. PR builds
        # (incl. forks) skip — forks don't have the secret, and even non-fork
        # PRs don't need to burn ~3min signing a release AAB on every commit.
        # Mirrors the debug-keystore decode step above: base64-decode,
        # validate with `keytool -list` so wrong-base64 / wrong-password
        # fails here rather than at signing time, then export the path to
        # GITHUB_ENV for bundleRelease to pick up.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::UPLOAD_KEYSTORE_BASE64 secret is not set; cannot build a Play-uploadable AAB."
            exit 1
          fi
          missing=""
          [ -z "$UPLOAD_KEYSTORE_PASSWORD" ] && missing="$missing UPLOAD_KEYSTORE_PASSWORD"
          [ -z "$UPLOAD_KEY_ALIAS" ]         && missing="$missing UPLOAD_KEY_ALIAS"
          [ -z "$UPLOAD_KEY_PASSWORD" ]      && missing="$missing UPLOAD_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::UPLOAD_KEYSTORE_BASE64 is set but the following companion secrets are missing or empty:$missing"
            exit 1
          fi
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$UPLOAD_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Decoded keystore at \$RUNNER_TEMP/upload.jks is not a valid keystore or UPLOAD_KEYSTORE_PASSWORD is wrong."
            exit 1
          fi
          echo "UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Bundle release AAB
        # Push-to-main (or manual workflow_dispatch on main) only — see
        # "Decode upload keystore" rationale. Produces
        # app/build/outputs/bundle/release/app-release.aab signed with the upload
        # key; Play App Signing re-signs with the real signing key on download.
        #
        # Both DEBUG_* and UPLOAD_* env vars are passed: Gradle evaluates *all*
        # signingConfigs at configure time, so even though `bundleRelease` only
        # uses the release config, the debug block at app/build.gradle.kts also
        # runs and its partial-config guard would fail the build if DEBUG_*
        # were only partially populated. DEBUG_KEYSTORE_FILE comes via
        # $GITHUB_ENV from the earlier decode step.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          # Baked into BuildConfig.GEMINI_PROXY_URL — picked up by
          # AppCheckGeminiCallPlanner so the Play APK can route Gemini TTS through
          # the developer-paid Cloud Function proxy when no BYOK key is set.
          # Blank when the secret is unset (forks, CI repos without the proxy
          # deployed): planner falls back to BYOK-only, same as a debug build
          # without geminiProxyUrl in local.properties.
          GEMINI_PROXY_URL: ${{ secrets.GEMINI_PROXY_URL }}
        run: |
          set -o pipefail
          ./gradlew :app:bundleRelease --stacktrace --info 2>&1 | tee -a /tmp/android-build.log

      - name: Upload release AAB
        # Browser-downloadable artifact for manual upload to Play Console — kept
        # even after the auto-upload step below so the AAB is recoverable if the
        # Play upload fails (or for ad-hoc browser uploads to other tracks).
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && success()
        uses: actions/upload-artifact@v7
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload AAB to Play Store internal track
        # Push-to-main (or manual workflow_dispatch on main) only; skipped
        # when PLAY_SERVICE_ACCOUNT_JSON isn't set (PLAY_AVAILABLE comes from
        # the "Probe publish secrets" step) so a fresh repo / fork still
        # completes CI. Ordered AFTER the release-AAB artifact upload so a
        # Play API failure (e.g. listing not yet approved, versionCode
        # collision) doesn't gate the artifact behind `success()`. Pinned to
        # a specific commit SHA — bump deliberately.
        if: |
          success() &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' &&
          env.PLAY_AVAILABLE == 'true' &&
          env.RELEASE_NOTES_SKIP != 'true'
        uses: r0adkll/upload-google-play@a80b0bcdcfdfcc2d026f2bc73f726760b2cbc967 # post-v1.1.5: fixes DEP0040/DEP0169 Node.js deprecation warnings
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.clothescast
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/whatsnew

      - name: Clear prior CI comments for this job
        # Same rationale as the JVM job — drops stale failure comments on a
        # clean re-run so the PR doesn't accumulate. Same continue-on-error
        # and pagination reasoning too.
        continue-on-error: true
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- ci-android-build -->';
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
              for (const c of comments) {
                if (c.user.type === 'Bot' && c.body && c.body.includes(marker)) {
                  await github.rest.issues.deleteComment({
                    ...context.repo,
                    comment_id: c.id,
                  });
                }
              }
            } catch (e) {
              core.warning(`Could not clear prior Android-build comments (${e.message}); an earlier failure comment may still be on the PR.`);
            }

      - name: Post tail of gradle log on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ci-android-build -->';
            // Same budgeting as the JVM job's comment — see the rationale
            // there. An over-long body 422s and loses the whole comment.
            const LIMIT = 60000;
            const trimmed = '\n\n_Trimmed — the full log is in the `android-build-log` artifact._';
            let body = `${marker} Android debug build failed before gradle started.`;
            try {
              const lines = fs.readFileSync('/tmp/android-build.log', 'utf8').split('\n');
              const errorLines = lines.filter(l =>
                /^(e:|w:| {2}error:|FAILURE:|\* What went wrong:|Caused by:|Compilation error)/.test(l)
              ).slice(0, 80).join('\n') || '(none matched)';
              const head = `${marker} Android debug build failed.\n\n` +
                '### Likely error lines\n```\n' + errorLines + '\n```\n' +
                '### Last 300 lines\n```\n';
              let tail = lines.slice(-300).join('\n');
              const budget = LIMIT - head.length - '\n```'.length - trimmed.length;
              const overflowed = tail.length > budget;
              if (overflowed) tail = tail.slice(-Math.max(budget, 0));
              body = head + tail + '\n```' + (overflowed ? trimmed : '');
              const suffix = '\n```' + trimmed;
              if (body.length > LIMIT) body = body.slice(0, LIMIT - suffix.length) + suffix;
            } catch (e) {
              body = `${marker} Android debug build failed before gradle started: ${e.message}`;
            }
            try {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            } catch (e) {
              core.warning(`Could not post the failing-build comment (${e.message}); the log is in the job output above and in the android-build-log artifact.`);
            }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-build-log
          path: /tmp/android-build.log
          retention-days: 14

  # The one check the main ruleset requires. Always runs, always reports —
  # green only when every heavy job succeeded, or when they were skipped and
  # the skip is INDEPENDENTLY verified as justified: the diff re-derived as
  # housekeeping-only and every commit subject carrying a housekeeping
  # prefix. Any other combination is an explicit red, never a silent pass.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [classify, unit-tests, android-build, checker-tests, functions-build]
    if: always()
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          CLASSIFY: ${{ needs.classify.result }}
          RESULTS: >-
            unit=${{ needs.unit-tests.result }}
            android=${{ needs.android-build.result }}
            checker=${{ needs.checker-tests.result }}
            functions=${{ needs.functions-build.result }}
        run: scripts/docs-lane.sh gate
