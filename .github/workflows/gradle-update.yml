name: gradle-update

# One batched Gradle dependency PR per week, produced by the shared
# mikelward/gradle-update workflow: every gradle/libs.versions.toml entry
# moves to the newest stable release within its current major, the checks
# below validate the batch, and a passing batch lands by auto-merge. All
# policy lives in the shared workflow; this caller owns only the schedule
# and the permission grant, which the called workflow downscopes per job —
# the job that runs Gradle only ever sees contents: read.
#
# The @main reference is deliberate, not an unpinned third-party action:
# gradle-update is this owner's repo, its main only moves through its own
# gated pull requests (CI + automated review, no direct pushes), and the
# whole point of the shared workflow is that a fix there reaches every
# consumer's next run with no per-repo bump PRs — the drift those bumps
# reintroduce is what the shared repo exists to kill. A SHA pin here would
# also pin less than it appears to: the workflow checks its engine out at
# main by design, so the moving piece would move regardless.
on:
  schedule:
    - cron: '17 6 * * 6'   # Saturdays, off the congested top of the hour
  workflow_dispatch:
permissions: {}
concurrency:
  group: gradle-update
  cancel-in-progress: false
jobs:
  update:
    uses: mikelward/gradle-update/.github/workflows/gradle-update.yml@main
    permissions:
      contents: write
      pull-requests: write
      actions: write
    # `inherit`, not a `secrets:` block: the called workflow's publish job
    # reads GRADLE_UPDATE_PAT (or the App pair) from this repository's
    # `gradle-update` environment, and an environment secret reaches a
    # called workflow no other way. A secret passed by name reaches the
    # runner of every job in the called workflow, the untrusted update job
    # included, which is what this replaces — see docs/PAT.md in
    # mikelward/gradle-update (the PAT takes priority over the App
    # credential there; either opens the PR as a real collaborator, so CI
    # starts on it normally — no first-time-contributor approval to click
    # through). The corresponding zizmor finding (secrets-inherit) is
    # excused inline on that one line, with the same reason;
    # .github/zizmor.yml says why the inline form rather than a file entry.
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      # Belt-and-suspenders fallback: covers a rerun that adopts a PR from
      # before the App secrets above existed, and the (unexpected) case of
      # the App token being unset. This repo's CI file is ci.yml, not the
      # shared default android-ci.yml; it already carries workflow_dispatch
      # with the pr input on main.
      ci-workflow: ci.yml
      # mikelward/androidlog publishes its own Maven repository into the
      # `maven` branch of that repository, which raw.githubusercontent.com
      # serves; settings.gradle.kts declares it, scoped to that one group.
      # Declaring it HERE as well is not optional — the batch resolves
      # versions itself, and without this it would never see a release of
      # com.mikelward.androidlog at all.
      extra-repositories: |
        https://raw.githubusercontent.com/mikelward/androidlog/maven
      # The release-age cooldown exists so a compromised THIRD-PARTY release
      # has time to be yanked. androidlog is this owner's own repository,
      # published by its own gated workflow, so the window guards nothing and
      # only adds latency between a release there and the batch that takes it.
      #
      # It would also never expire: raw.githubusercontent.com serves no
      # `Last-Modified`, so there is no release date to age out — the
      # coordinate would be deferred forever rather than merely delayed.
      no-cooldown-for: |
        com.mikelward.androidlog:logging-android
      # The license inventory is derived from the dependency set, so the
      # batch rebuilds it and commits it alongside the catalog — without
      # this, ci.yml's drift check turns every benign bump into a manual
      # regeneration push.
      regenerate: |
        ./gradlew :app:exportBundledLicenses --rerun
      regenerated-files: |
        app/src/main/res/raw/aboutlibraries.json
