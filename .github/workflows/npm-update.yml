name: npm update

# The thin caller for mikelward/npm-update's reusable workflow — see that
# repo's README.md for the wiring contract. Covers the Cloud Functions
# backend under functions/ (the only npm tree in this repo; gradle-update.yml
# covers the Android side the same way) via the `working-directory` input —
# this repo piloted that input (mikelward/npm-update#21) since its npm tree
# isn't at the repository root, unlike the hub's other consumers. This repo
# owns the schedule and the manual trigger, and grants the reusable workflow
# the permissions its jobs need (its own top-level permissions are empty by
# design; each job declares only what it needs, capped by what's granted
# here).
#
# The check suite the hub runs is fixed — npm ci, npm run lint, npm test,
# npm run build — so functions/package.json now carries no-op `lint`/`test`
# scripts (it had neither before: "the Functions tree has no lint or tests
# yet") rather than the hub failing those two checks every week. This
# preserves the old standalone workflow's reduced two-check behavior without
# needing the hub to support a configurable check set.

on:
  schedule:
    # 06:47 UTC on Saturdays — same day as gradle-update.yml (one weekly batch
    # morning, two PRs), off the congested top of the hour, and off gradle's
    # own minute so the two runs' pushes and PR opens don't interleave.
    - cron: '47 6 * * 6'
  workflow_dispatch:

# No permissions at the workflow level. The job that runs unreviewed dependency
# code gets a read-only token; only the publish job, which runs none, can write.
permissions: {}

concurrency:
  group: npm-update
  cancel-in-progress: false

jobs:
  npm-update:
    uses: mikelward/npm-update/.github/workflows/npm-update.yml@main
    permissions:
      contents: write
      pull-requests: write
      actions: write
    # `inherit`, not a `secrets:` block: the called workflow's publish job
    # reads NPM_UPDATE_PAT (or the App pair) from this repository's
    # `npm-update` environment, and an environment secret reaches a called
    # workflow no other way. A secret passed by name reaches the runner of
    # every job in the called workflow, the untrusted update job included,
    # which is what this replaces. The credential itself is what it was: it
    # opens the batch PR as a real collaborator rather than as
    # `GITHUB_TOKEN`, whose events start no `on: pull_request` workflow —
    # so without it the PR's head gets no `zizmor` run and the ruleset
    # holds it on a required check nothing produces (TODO.md, the same
    # failure the snapshot job's token already fixes for regenerated
    # heads). The sibling gradle-update caller inherits the same way. The
    # corresponding zizmor finding (secrets-inherit) is excused inline on
    # that one line, with the same reason; .github/zizmor.yml says why the
    # inline form rather than a file entry.
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      working-directory: functions
      # The Cloud Functions build emits a gitignored functions/lib/, which is
      # not one of the outputs the hub knows about — so every run aborted at
      # its ignored-file guard, after its own build step, and this batch never
      # opened a PR (mikelward/npm-update#30).
      ignored-build-outputs: lib/
