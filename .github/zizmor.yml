# Policy for zizmor; the advisory workflow beside this file runs it.
#
# The defaults demand hash pins everywhere and refuse pull_request_target
# outright. Both collide with decisions made deliberately across this
# fleet of repos, so the exceptions live here, scoped as narrowly as the
# tool allows.
rules:
  unpinned-uses:
    config:
      policies:
        # `@main` IS the release for these sibling actions/workflows: this
        # repo tracks them deliberately, there is no release step on their
        # side, and a pin would be a thing to bump here on every one of
        # their merges. Enumerated by name, not `mikelward/*` — owner-wide
        # would also excuse a future workflow pulling any sibling at a
        # mutable ref, and each exemption should be a decision somebody made.
        "mikelward/codex-review": ref-pin
        # Same repository, but the key is matched whole against the `uses:`
        # value including the workflow path, so the reusable workflow the
        # consumer-side check calls needs its own entry — the action
        # reference above does not cover it.
        "mikelward/codex-review/.github/workflows/check-consumer.yml": ref-pin
        "mikelward/gradle-update/.github/workflows/gradle-update.yml": ref-pin
        # `@main` is likewise the release for the lane-classification
        # engine ci.yml's classify/gate/lanes jobs invoke -- same
        # repo-tracked-deliberately reasoning as codex-review above.
        "mikelward/lanes": ref-pin
        # Same reasoning as gradle-update above: this repo tracks the
        # reusable workflow deliberately, there is no release step on its
        # side, and a pin would be a thing to bump here on every merge
        # there.
        "mikelward/npm-update/.github/workflows/npm-update.yml": ref-pin
        # Piloted against its own branch until mikelward/ci-commit-artifact#1
        # merges, per that repo's own "pilot before merge" convention —
        # switches to @main once it has.
        "mikelward/ci-commit-artifact/.github/workflows/commit-artifact.yml": ref-pin
        # Official actions may pin to a tag, as every workflow here does.
        # Hash-pinning them instead is a deliberate open question, tracked
        # the same way mikelward/codex-review tracks it for itself.
        "actions/*": ref-pin
        # Gradle's own official action, same reasoning as actions/* above.
        "gradle/actions/*": ref-pin
        # Everything else must pin to a hash.
        "*": hash-pin
  dangerous-triggers:
    # Both triggers are load-bearing and reasoned through in
    # mikelward/codex-review's docs/CONSUMER.md.
    ignore:
      # The sweep: never checks out or executes pull request code at all.
      - codex-review.yml
      # The consumer-side check: pull_request_target so the JOB DEFINITION
      # always loads from the default branch (a bare pull_request would let
      # a PR editing this file replace the call with one that always
      # succeeds), and it does check out the PR head — but only to hand it
      # to check_consumer.py, which parses it as text and executes nothing
      # from it. See check-consumer.yml in mikelward/codex-review for the
      # full reasoning.
      - codex-review-check.yml
  # `secrets-inherit` is deliberately NOT configured here. The three callers
  # that pass `secrets: inherit` on purpose -- the weekly batches in
  # gradle-update.yml and npm-update.yml, and the snapshot commit-back in
  # ci.yml -- carry an inline `# zizmor: ignore[secrets-inherit]` on that
  # one line, with the reasoning beside it: the called workflow's
  # publish/commit job reads its credential from an environment
  # (`gradle-update`, `npm-update`, `ci-commit-artifact`), and an
  # environment secret reaches a called workflow no other way, while the
  # `secrets:` block zizmor prefers delivers the credential to the runner of
  # every job in the called workflow, the untrusted update job included. A
  # file entry here would also excuse a NEW `secrets: inherit` on any other
  # call in those files; the inline form excuses only the call it sits on.
  # The price of `inherit` is that every repository-level secret reaches
  # the called jobs too, so this repository keeps its secrets
  # environment-scoped (mikelward/repo's `repo audit` reports any that are
  # not, and `repo setup` moves them).
