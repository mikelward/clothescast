[versions]
agp = "8.7.3"
kotlin = "2.0.21"
# Android API floor. Single source of truth: `app/build.gradle.kts` reads this
# for `minSdk` and re-emits it as `BuildConfig.MIN_SDK_VERSION` so the runtime
# can defend against APKs landing on devices below the floor. The OS package
# manager normally enforces this at install time, but Firebase has shown the
# app crashing on a OnePlus 8 Pro reporting Android 11 (API 30 — see PR #369)
# against this minSdk=31 APK. Whatever install path produced that, the
# resulting Crashlytics noise is from a configuration we never built for, so
# Telemetry silences Firebase when SDK_INT < MIN_SDK_VERSION.
minSdk = "31"
ksp = "2.0.21-1.0.27"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2026.03.00"
# Navigation Compose — type-safe routes (@Serializable destinations) require
# 2.8.0+. Aligned with lifecycle 2.8.x (the repo is on 2.8.7); 2.8.x keeps the
# androidx.core baseline at 1.13–1.15 so it doesn't force a compileSdk lift the
# way Vico/Glance bumps would. Bump in lockstep with any AGP/compileSdk upgrade.
navigation = "2.8.5"
junit5 = "5.11.3"
mockk = "1.13.13"
kotest = "5.9.1"
turbine = "1.2.0"
coroutines = "1.9.0"
ktor = "3.0.2"
zxing = "3.5.3"
serialization = "1.7.3"
tink = "1.15.0"
datastore = "1.1.1"
work = "2.10.0"
# Glance powers the home-screen App Widget. 1.1.1 is the latest stable that
# works with AGP 8.7 / compileSdk 35 — 1.2.x bumps the AndroidX core baseline
# and would force a compileSdk lift, paralleling the Vico version pin above.
glance = "1.1.1"
# Pinned to the 2.0.x line: Vico 2.2+ pulls androidx.core:core-ktx 1.16+ and
# 2.3+ pulls 1.17+, both of which require AGP 8.9+ / compileSdk 36. The app is
# on AGP 8.7.3 / compileSdk 35; bump Vico in lockstep with an AGP upgrade.
vico = "2.0.3"
# Roborazzi renders @Preview composables to PNG via Robolectric — no emulator
# needed, runs in :app's JVM unit tests job. The CI step uploads the PNGs as a
# workflow artifact for human review on every PR (no diff gate, by intent).
roborazzi = "1.32.0"
robolectric = "4.14.1"
junit4 = "4.13.2"
# Play in-app updates: AppUpdateManager + the FLEXIBLE flow (background download
# + "Restart to install" prompt). Used to surface the update-available banner on
# the Today screen for Play-Store installs only.
playAppUpdate = "2.1.0"
# Firebase Analytics + Crashlytics. The BoM aligns SDK versions; the two Gradle
# plugins (gms-google-services, firebase-crashlytics) are applied conditionally
# in app/build.gradle.kts based on app/google-services.json's presence so CI
# (which doesn't carry the file) still compiles. See PRIVACY.md for the data
# boundary contract these SDKs operate under.
firebaseBom = "33.7.0"
gmsGoogleServices = "4.4.2"
firebaseCrashlyticsPlugin = "3.0.2"
# HiveMQ MQTT Client — used by the optional Smart Home bridge to publish the
# rendered insight prose to a user-hosted MQTT broker (Mosquitto add-on inside
# Home Assistant, typically). Pure-Java + Netty; no JNI. The publisher uses the
# blocking client wrapped in withContext(Dispatchers.IO), so no Reactor /
# CompletableFuture await plumbing is needed in :app.
hivemqMqttClient = "1.3.3"
# Google Cast — pulls in androidx.mediarouter for the route discovery /
# session APIs and `play-services-cast` for RemoteMediaClient. Cast SDK
# itself doesn't need google-services.json; framework init is gated at
# runtime on Google Play services availability, so CI builds without the
# JSON still compile and assemble.
playServicesCast = "21.5.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit5" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junit5" }
junit-jupiter-params = { group = "org.junit.jupiter", name = "junit-jupiter-params", version.ref = "junit5" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
kotest-assertions-core = { group = "io.kotest", name = "kotest-assertions-core", version.ref = "kotest" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }

ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { group = "io.ktor", name = "ktor-client-logging", version.ref = "ktor" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-cio = { group = "io.ktor", name = "ktor-server-cio", version.ref = "ktor" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

tink-android = { group = "com.google.crypto.tink", name = "tink-android", version.ref = "tink" }

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-datastore-preferences-core = { group = "androidx.datastore", name = "datastore-preferences-core", version.ref = "datastore" }

androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
androidx-glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }

vico-compose-m3 = { group = "com.patrykandpatrick.vico", name = "compose-m3", version.ref = "vico" }

# Snapshot testing — see roborazzi version comment above for rationale.
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
# JUnit Vintage lets the JUnit 5 platform run JUnit 4 tests. Roborazzi/Robolectric
# require @RunWith(AndroidJUnit4::class) (a JUnit 4 mechanism), so we keep the
# JUnit 5 platform and let Vintage run the snapshot tests alongside.
junit-vintage-engine = { group = "org.junit.vintage", name = "junit-vintage-engine", version.ref = "junit5" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

play-app-update-ktx = { group = "com.google.android.play", name = "app-update-ktx", version.ref = "playAppUpdate" }

firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }

hivemq-mqtt-client = { group = "com.hivemq", name = "hivemq-mqtt-client", version.ref = "hivemqMqttClient" }

play-services-cast-framework = { group = "com.google.android.gms", name = "play-services-cast-framework", version.ref = "playServicesCast" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
gms-google-services = { id = "com.google.gms.google-services", version.ref = "gmsGoogleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsPlugin" }
