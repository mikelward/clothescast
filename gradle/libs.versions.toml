[versions]
# AGP 8.10.x is the newest line that still runs on the repo's current Gradle
# 8.11.1 wrapper (AGP 8.11+ requires Gradle 8.13+); it supports compileSdk 36,
# which targetSdk 36 needs (AGP 8.7.x capped at compileSdk 35). Bump the Gradle
# wrapper in lockstep before moving to AGP 8.11+.
agp = "8.10.1"
kotlin = "2.2.21"
# Android API floor. Single source of truth: `app/build.gradle.kts` reads this
# for `minSdk` and re-emits it as `BuildConfig.MIN_SDK_VERSION` so the runtime
# can defend against APKs landing on devices below the floor. The OS package
# manager normally enforces this at install time, but Firebase has shown the
# app crashing on a OnePlus 8 Pro reporting Android 11 (API 30 — see PR #369)
# against this minSdk=31 APK. Whatever install path produced that, the
# resulting Crashlytics noise is from a configuration we never built for, so
# Telemetry silences Firebase when SDK_INT < MIN_SDK_VERSION.
minSdk = "31"
ksp = "2.2.21-2.0.5"
coreKtx = "1.18.0"
lifecycle = "2.10.0"
activityCompose = "1.13.0"
composeBom = "2026.05.01"
# Navigation Compose — type-safe routes (@Serializable destinations) require
# 2.8.0+. 2.9.x is the current stable line (2.10.0 is still alpha); it depends
# on lifecycle 2.9.x but composes fine against the 2.10.0 we pin above.
navigation = "2.9.8"
# Drag-and-drop reordering for Compose lists/columns (used by the Settings →
# Display "Home screen layout" reorder UI). 3.1.0 needs Compose foundation
# 1.7.0+, well under the BoM above. Lives on Maven Central.
reorderable = "3.1.0"
junit5 = "5.11.3"
mockk = "1.14.11"
kotest = "5.9.1"
turbine = "1.2.1"
coroutines = "1.11.0"
ktor = "3.5.0"
zxing = "3.5.4"
serialization = "1.11.0"
tink = "1.21.0"
datastore = "1.2.1"
work = "2.11.2"
# Glance powers the home-screen App Widget. Held at 1.1.1: 1.2.x exists only as
# a release candidate (no stable yet) and is what the live-widget-preview API
# needs — tracked in #914. compileSdk is no longer the blocker; the RC status is.
glance = "1.1.1"
# Vico charting (forecast graphs). The old Kotlin-2.0-metadata pin is gone now
# that Kotlin is on 2.2.x (it can read the 2.1.x stdlib metadata 2.1.0+ ship),
# so newer 2.x is reachable — but the bump is deferred to a follow-up: Vico
# 2.1+ changes chart-host frame timing in a way that makes the 7-day page's
# minute-tick scrub loop never reach idle under the snapshot harness's clock,
# which needs a harness fix to land cleanly. Tracked separately; 2.0.3 builds
# and tests fine on Kotlin 2.2. (Vico 3.x is a full API rewrite — a separate
# migration again, not a version bump.)
vico = "2.0.3"
# Roborazzi renders @Preview composables to PNG via Robolectric — no emulator
# needed, runs in :app's JVM unit tests job. The CI step uploads the PNGs as a
# workflow artifact for human review on every PR (no diff gate, by intent).
roborazzi = "1.32.0"
robolectric = "4.16.1"
junit4 = "4.13.2"
# Play in-app updates: AppUpdateManager + the FLEXIBLE flow (background download
# + "Restart to install" prompt). Used to surface the update-available banner on
# the Today screen for Play-Store installs only.
playAppUpdate = "2.1.0"
# Firebase Analytics + Crashlytics. The BoM aligns SDK versions; the two Gradle
# plugins (gms-google-services, firebase-crashlytics) are applied conditionally
# in app/build.gradle.kts based on app/google-services.json's presence so CI
# (which doesn't carry the file) still compiles. See PRIVACY.md for the data
# boundary contract these SDKs operate under.
firebaseBom = "34.14.0"
gmsGoogleServices = "4.4.4"
firebaseCrashlyticsPlugin = "3.0.7"
# HiveMQ MQTT Client — used by the optional Smart Home bridge to publish the
# rendered insight prose to a user-hosted MQTT broker (Mosquitto add-on inside
# Home Assistant, typically). Pure-Java + Netty; no JNI. The publisher uses the
# blocking client wrapped in withContext(Dispatchers.IO), so no Reactor /
# CompletableFuture await plumbing is needed in :app.
hivemqMqttClient = "1.3.14"
# Google Cast — pulls in androidx.mediarouter for the route discovery /
# session APIs and `play-services-cast` for RemoteMediaClient. Cast SDK
# itself doesn't need google-services.json; framework init is gated at
# runtime on Google Play services availability, so CI builds without the
# JSON still compile and assemble.
playServicesCast = "22.3.1"

